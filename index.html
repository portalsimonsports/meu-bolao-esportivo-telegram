  <script>
    const URL_PARAMS=new URLSearchParams(window.location.search||'');
    const API_PARAM=URL_PARAMS.get('api')||'';
    // V035: api= não é mais usado para carregar tela. Ele fica apenas como compatibilidade para ações de gravação.
    if(API_PARAM){try{localStorage.setItem('PSS_MBE_API_URL',API_PARAM)}catch(e){}}

    function startParamInicialBolao_(){
      let sp=URL_PARAMS.get('tgWebAppStartParam')||URL_PARAMS.get('startapp')||'';
      sp=String(sp||'').trim();
      if(!sp)return '';
      const partes=sp.split('_');
      return String(partes[0]||'').trim();
    }

    function startParamInicialCodigo_(){
      let sp=URL_PARAMS.get('tgWebAppStartParam')||URL_PARAMS.get('startapp')||'';
      sp=String(sp||'').trim();
      if(!sp)return '';
      const partes=sp.split('_');
      return String(partes[1]||'').trim().toUpperCase();
    }

    function codigoConviteInicial_(){
      return String(URL_PARAMS.get('codigo_convite')||URL_PARAMS.get('codigo')||URL_PARAMS.get('convite')||startParamInicialCodigo_()||'').trim().toUpperCase();
    }

    function entradaBolaoExplicita_(){
      const urlId=String(URL_PARAMS.get('id_bolao')||'').trim();
      const startId=startParamInicialBolao_();
      const convite=codigoConviteInicial_();
      return !!(urlId||startId||convite);
    }

    function selecaoManualSalva_(){
      try{return String(localStorage.getItem('PSS_MBE_BOLAO_ATIVO_ESCOLHIDO')||'').toUpperCase()==='SIM'}catch(e){return false}
    }

    function idBolaoInicial_(){
      const salvo=String(localStorage.getItem('PSS_MBE_BOLAO_ATIVO')||'').trim();
      const urlId=String(URL_PARAMS.get('id_bolao')||'').trim();
      const startId=startParamInicialBolao_();
      const temConvite=!!codigoConviteInicial_();
      if(startId)return startId;
      // Correção definitiva: link antigo do menu pode vir com id_bolao=BOLAO001.
      // Sem convite, a última seleção do usuário tem prioridade para não voltar sempre ao bolão padrão.
      if(salvo&&!temConvite)return salvo;
      if(urlId)return urlId;
      return 'BOLAO001';
    }

    const CONFIG={
      VERSAO:'V058_PLACAR_X_CENTRAL_ALINHADO',
      API_URL:API_PARAM||'', // V035: usado somente para gravação; leitura principal vem dos JSONs estáticos.
      API_URL_FIXA:'https://script.google.com/macros/s/AKfycbzp2XfmJUtcSrZNZe9Jk45ESlvvRoEMZULSw13J0qgd5ukchetCdppOQ65wrpp2OKw/exec', // Fallback somente para ações de gravação caso o JSON não traga apiUrl.
      ID_BOLAO:idBolaoInicial_(),
      CODIGO_CONVITE:codigoConviteInicial_(),
      ENVIAR_AO_BOT_SEM_API:true,
      CACHE_TTL_MINUTOS:30,
      CACHE_MAX_HORAS:24,
      TELEGRAM_MINIAPP_OFICIAL:'https://t.me/MeuBolaoEsportivoBot/meubolaoesportivo',
      JSON_PUBLICO_ATIVO:true,
      JSON_PUBLICO_BASE:'data',
      JSON_PUBLICO_TIMEOUT_MS:4500,
      API_REFRESH_SILENCIOSO:false,
      // V033: abertura pelo menu do Telegram sem id_bolao deve carregar o PERFIL do usuário,
      // não forçar BOLAO001 nem JSON público anônimo.
      AUTO_PERFIL:(!entradaBolaoExplicita_()&&!selecaoManualSalva_())
    };

    const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
    const estado={
      usuario:{idTelegram:'',nome:'Participante',username:''},
      jogo:null,
      ranking:[],
      rankingTipo:'AGUARDANDO_RESULTADOS',
      rankingLegenda:'',
      jogos:[],
      boloes:[],
      boloesPublicos:[],
      meusBoloesCriados:[],
      boloesParticipando:[],
      bolaoAtual:null,
      meusPalpites:{},
      carregando:true,
      erroApi:'',
      palpite:'',
      cacheUsado:false,
      cacheAtualizadoEm:'',
      sincronizandoBoloes:false,
      tentouAtualizarBoloesTelegram:false,
      usuarioAdmin:false
    };

    // V036: mantém manifesto, perfil e homes dos bolões em memória/localStorage.
    // Troca de bolão não deve chamar Apps Script/API; deve renderizar JSON estático já publicado.
    const JSON_ESTATICO_MEM={manifest:null,perfil:null,homes:{},preloadIniciado:false};

    function initTelegram(){
      if(tg){
        tg.ready();tg.expand();
        try{tg.setHeaderColor('#062d1d');tg.setBackgroundColor('#00170e');tg.enableClosingConfirmation()}catch(e){}
        const u=tg.initDataUnsafe&&tg.initDataUnsafe.user?tg.initDataUnsafe.user:null;
        if(u){
          estado.usuario={idTelegram:String(u.id||''),nome:[u.first_name,u.last_name].filter(Boolean).join(' ')||u.username||'Participante',username:u.username||''};
          try{localStorage.setItem('PSS_MBE_ULTIMO_TELEGRAM_ID',estado.usuario.idTelegram);localStorage.setItem('PSS_MBE_ULTIMO_NOME',estado.usuario.nome);localStorage.setItem('PSS_MBE_ULTIMO_USERNAME',estado.usuario.username||'')}catch(e){}
        }
      }

      // Fallback só para teste no navegador: permite abrir como ?telegram_id=197139159.
      // No uso real, o Telegram envia o id automaticamente via initDataUnsafe.user.
      if(!estado.usuario.idTelegram && URL_PARAMS.get('telegram_id')){
        estado.usuario={idTelegram:String(URL_PARAMS.get('telegram_id')||''),nome:URL_PARAMS.get('nome')||'Participante',username:URL_PARAMS.get('username')||''};
      }

      aplicarStartParamTelegram();
    }

    function aplicarStartParamTelegram(){
      let sp=URL_PARAMS.get('tgWebAppStartParam')||URL_PARAMS.get('startapp')||'';
      try{if(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)sp=tg.initDataUnsafe.start_param||sp}catch(e){}
      sp=String(sp||'').trim();
      if(!sp)return;
      const partes=sp.split('_');
      if(partes[0])CONFIG.ID_BOLAO=partes[0];
      if(partes[1])CONFIG.CODIGO_CONVITE=partes[1].toUpperCase();
    }

    function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
    function apiUrl(){
      const param=String(CONFIG.API_URL||'').trim();
      const salva=String(localStorage.getItem('PSS_MBE_API_URL')||'').trim();
      const fixa=String(CONFIG.API_URL_FIXA||'').trim();

    function scoreDuplicado(j){
      let score=0;
      const hora=String(j&&j.hora||'').trim();
      const limite=String(j&&j.limitePalpite||'').trim();
      if(hora)score+=10;
      if(hora&&hora!=='00:00'&&hora!=='00:00:00')score+=100;
      if(limite&&limite.indexOf('00:00')<0)score+=50;
      if(j&&j.aceitaPalpite)score+=5;
      return score;
    }

    function deduplicarJogos(jogos){
      const mapa={};
      (jogos||[]).forEach(j=>{
        const chave=chaveJogoSemHora(j);
        if(!chave)return;
        if(!mapa[chave]||scoreDuplicado(j)>scoreDuplicado(mapa[chave]))mapa[chave]=j;
      });
      return Object.values(mapa).sort((a,b)=>String((a.data||'')+' '+(a.hora||'')).localeCompare(String((b.data||'')+' '+(b.hora||''))));
    }

    async function fetchJsonComTimeout(url,timeoutMs){
      const controller=window.AbortController?new AbortController():null;
      const timer=setTimeout(()=>{try{if(controller)controller.abort()}catch(e){}},Number(timeoutMs||4500));
      try{
        const resp=await fetch(url,{cache:'no-cache',signal:controller?controller.signal:undefined});
        const texto=await resp.text();
        if(!resp.ok)throw new Error('HTTP '+resp.status+' em '+url);
        const t=String(texto||'').trim();
        if(!t)throw new Error('JSON vazio ou ainda não publicado: '+url);
        if(/^<!doctype|^<html|^</i.test(t))throw new Error('JSON ainda não publicado no domínio: '+url);
        try{return JSON.parse(t)}catch(e){throw new Error('JSON inválido ou publicação pendente: '+(e&&e.message?e.message:e));}
      }finally{clearTimeout(timer)}
    }

      id=String(id||'').trim();

      try{
        const raw=localStorage.getItem(homeJsonStorageKey(id));
        if(!raw)return null;

        if(!pacote||!pacote.home||!pacote.salvoEm)return null;
        const idadeHoras=(Date.now()-Number(pacote.salvoEm||0))/(60*60*1000);
        if(idadeHoras>Number(CONFIG.CACHE_MAX_HORAS||24))return null;
        const dadosHome=(pacote.home&&pacote.home.dados)?pacote.home.dados:pacote.home;
        if(!dadosHome||!Array.isArray(dadosHome.jogos)||!dadosHome.jogos.length)return null;
        JSON_ESTATICO_MEM.homes[id]=pacote.home;
        return pacote.home;
      }catch(e){return null;}

    function procurarHomeBaseParaBolaoNovo(){
      const ids=Object.keys(JSON_ESTATICO_MEM.homes||{});
      for(let i=0;i<ids.length;i++){
        const h=JSON_ESTATICO_MEM.homes[ids[i]];
        const d=(h&&h.dados)?h.dados:h;
        if(d&&Array.isArray(d.jogos)&&d.jogos.length)return h;
      }
      const base=lerHomeJsonEstaticoLocal('BOLAO001');
      if(base)return base;
      if(Array.isArray(estado.jogos)&&estado.jogos.length){
        return {ok:true,versao:CONFIG.VERSAO,gerado_em:'cache local',dados:{
          id_bolao:CONFIG.ID_BOLAO,

          jogos:estado.jogos,
          ranking:[],

          meusBoloesCriados:estado.meusBoloesCriados,

          meusPalpites:[]

    function criarHomeLocalParaBolaoNovo(bolao){
      const b=normalizarBolaoRespostaAcao(bolao,bolao&&bolao.codigo_convite);
      if(!b||!b.id_bolao)return null;
      const base=procurarHomeBaseParaBolaoNovo();
      if(!base)return null;
      const home=clonarObjetoSimples(base);
      const dados=(home&&home.dados)?home.dados:home;
      dados.id_bolao=b.id_bolao;
      dados.id_bolao_solicitado=b.id_bolao;
      dados.bolaoAtual=b;
      dados.ranking=[];
      dados.meusPalpites=[];
      dados.modoDados='JSON_LOCAL_IMEDIATO_AGUARDANDO_PUBLICACAO';
      dados.cacheAtualizadoEm='gerado localmente após criação/entrada';
      const jogos=Array.isArray(dados.jogos)?dados.jogos:[];
      dados.jogos=jogos.map(function(j){const x=Object.assign({},j);x.id_bolao=b.id_bolao;x.meuPalpite=null;return x;});
      const porId={};
      (Array.isArray(estado.boloes)?estado.boloes:[]).forEach(function(x){if(x&&x.id_bolao)porId[String(x.id_bolao)]=x;});
      porId[String(b.id_bolao)]=b;
      dados.boloes=Object.values(porId);
      dados.boloesPublicos=Array.isArray(estado.boloesPublicos)?estado.boloesPublicos:[];
      dados.meusBoloesCriados=Array.isArray(estado.meusBoloesCriados)?estado.meusBoloesCriados:[];
      if(b.souCriador)dados.meusBoloesCriados=upsertBolaoArrayLocal(dados.meusBoloesCriados,Object.assign({},b,{souCriador:true}));
      dados.boloesParticipando=Array.isArray(estado.boloesParticipando)?estado.boloesParticipando:[];
      if(!b.souCriador && String(b.tipo||b.tipo_bolao||'').toUpperCase()==='PRIVADO')dados.boloesParticipando=upsertBolaoArrayLocal(dados.boloesParticipando,b);
      const pacote=(home&&home.dados)?home:{ok:true,versao:CONFIG.VERSAO,gerado_em:'local',dados:dados};
      guardarHomeJsonEstatico(b.id_bolao,pacote);
      return pacote;
    }

    async function carregarHomeJsonEstatico(id,force){
      id=String(id||CONFIG.ID_BOLAO||'BOLAO001').trim()||'BOLAO001';
      if(!force){
        const local=lerHomeJsonEstaticoLocal(id);
        if(local)return local;
      }
      try{
        const home=await fetchJsonComTimeout(jsonPublicoHomeUrl(id),CONFIG.JSON_PUBLICO_TIMEOUT_MS||4500);
        const dadosHome=(home&&home.dados)?home.dados:home;
        if(!dadosHome||!Array.isArray(dadosHome.jogos)||!dadosHome.jogos.length){
          const b=bolaoPorIdEstatico(id);
          const localCriado=b?criarHomeLocalParaBolaoNovo(b):null;
          if(localCriado)return localCriado;
          throw new Error('home_'+id+'.json publicado sem jogos.');
        }
        guardarHomeJsonEstatico(id,home);
        return home;
      }catch(e){
        const b=bolaoPorIdEstatico(id);
        const localCriado=b?criarHomeLocalParaBolaoNovo(b):null;
        if(localCriado)return localCriado;
        throw e;
      }
    }

      const explicito=String(URL_PARAMS.get('id_bolao')||startParamInicialBolao_()||'').trim();

      const salvo=String(localStorage.getItem('PSS_MBE_BOLAO_ATIVO')||'').trim();
      const d=(perfil&&perfil.dados)?perfil.dados:perfil||{};
      const idsPerfil=listaBoloesPerfil(perfil).map(function(b){return String(b.id_bolao)});
      if(salvo&&idsPerfil.indexOf(salvo)>=0)return salvo;
      if(d.ultimoBolao&&d.ultimoBolao.id_bolao)return String(d.ultimoBolao.id_bolao);
      if(Array.isArray(d.boloesComPalpite)&&d.boloesComPalpite.length)return String(d.boloesComPalpite[0].id_bolao||'');
      if(Array.isArray(d.meusBoloesCriados)&&d.meusBoloesCriados.length)return String(d.meusBoloesCriados[0].id_bolao||'');
      if(Array.isArray(d.boloesParticipando)&&d.boloesParticipando.length)return String(d.boloesParticipando[0].id_bolao||'');
      if(idsPerfil.length)return idsPerfil[0];
      const bm=listaBoloesManifest(manifest);
      if(bm.length)return String(bm[0].id_bolao||'');
      return String(CONFIG.ID_BOLAO||'BOLAO001');

    function mesclarHomeComPerfilJson(home,perfil,manifest,idBolao){

      const dados=Object.assign({},pacoteHome);

      listaBoloesManifest(manifest).forEach(addBolao);

      // V036: sempre força o contexto visual para o bolão selecionado.

      dados.bolaoAtual=dados.boloes.find(function(b){return String(b.id_bolao)===String(dados.id_bolao)})||dados.bolaoAtual||null;

    async function carregarJsonPublicoPerfilEstatico(){
      if(!CONFIG.JSON_PUBLICO_ATIVO)return false;
      const erros=[];
      let manifest=null,perfil=null,home=null;
      try{manifest=await fetchJsonComTimeout(jsonPublicoManifestUrl(),CONFIG.JSON_PUBLICO_TIMEOUT_MS||4500);JSON_ESTATICO_MEM.manifest=manifest;}catch(e){erros.push('manifest.json: '+e.message)}
      if(estado.usuario.idTelegram){
        const perfilUrl=jsonPublicoPerfilUrl(estado.usuario.idTelegram);
        if(perfilUrl){
          try{perfil=await fetchJsonComTimeout(perfilUrl,CONFIG.JSON_PUBLICO_TIMEOUT_MS||4500);JSON_ESTATICO_MEM.perfil=perfil;}catch(e){erros.push('perfil_'+estado.usuario.idTelegram+'.json: '+e.message)}
        }
      }
      const idEscolhido=escolherBolaoPorJson(manifest,perfil);
      if(idEscolhido)CONFIG.ID_BOLAO=idEscolhido;
      try{home=await carregarHomeJsonEstatico(CONFIG.ID_BOLAO,true)}catch(e){erros.push('home_'+CONFIG.ID_BOLAO+'.json: '+e.message)}

      const dadosHome=(home&&home.dados)?home.dados:home;
      if(!dadosHome||!Array.isArray(dadosHome.jogos)||!dadosHome.jogos.length){
        throw new Error(erros.length?erros.join(' | '):'JSON público sem jogos para '+CONFIG.ID_BOLAO+'.');
      }
      const dados=mesclarHomeComPerfilJson(home,perfil,manifest,CONFIG.ID_BOLAO);
      aplicarDadosApi(dados,'json_perfil');
      salvarCache(dados);
      estado.carregando=false;
      estado.erroApi='';

      setTimeout(function(){preCarregarHomesDoPerfilEstatico(manifest,perfil,CONFIG.ID_BOLAO)},120);

    function chavesCachePossiveis(){

    function limparCachesAntigosSeNecessario(){
      try{
        const apiSalva=String(localStorage.getItem('PSS_MBE_API_URL')||'');
        if(apiSalva && !/^https:\/\/script\.google\.com\/macros\/s\/[^\/]+\/exec/i.test(apiSalva))localStorage.removeItem('PSS_MBE_API_URL');

        // V031: limpa somente caches de HOME antigos que podiam trazer 45 jogos.
        // Não remove palpites locais nem dados reais da aba PALPITES.
        const limpar=String(URL_PARAMS.get('limpar_cache')||'').toLowerCase();
        const deveLimpar=limpar==='1'||limpar==='sim'||limpar==='true';
        const removiveis=[];
        for(let i=0;i<localStorage.length;i++){
          const k=localStorage.key(i)||'';
          if(k.startsWith('PSS_MBE_HOME_CACHE_')||k.startsWith('PSS_MBE_HOME_CACHE_INFO_')){
            if(deveLimpar || !k.includes('_V035_'))removiveis.push(k);
          }

        removiveis.forEach(k=>localStorage.removeItem(k));

    function aplicarDadosApi(dados, origem) {
  dados = dados || {};
  if (dados.apiUrl) {
    try { CONFIG.API_URL = String(dados.apiUrl || ''); localStorage.setItem('PSS_MBE_API_URL', CONFIG.API_URL); } catch(e) {}
  }
  if (dados.id_bolao) {
    CONFIG.ID_BOLAO = dados.id_bolao;
    // V035: JSON de perfil também resolve o bolão ativo da sessão.
    if (origem === 'api' || origem === 'json_perfil') CONFIG.AUTO_PERFIL = false;
    // Persiste o bolão ativo para sobreviver a recarregamentos, mas sem marcar como escolha manual.
    try { localStorage.setItem('PSS_MBE_BOLAO_ATIVO', dados.id_bolao); } catch(e) {}
  }
  estado.bolaoAtual = dados.bolaoAtual || null;
  estado.jogos = deduplicarJogos(Array.isArray(dados.jogos) ? dados.jogos.map(normalizarJogo).filter(Boolean) : []);
  estado.ranking = Array.isArray(dados.ranking) ? dados.ranking.map(normalizarRankingItem) : [];
  estado.rankingTipo = dados.rankingTipo || dados.ranking_tipo || 'AGUARDANDO_RESULTADOS';
  estado.rankingLegenda = dados.rankingLegenda || dados.ranking_legenda || '';
  estado.boloes = Array.isArray(dados.boloes) ? dados.boloes : [];
  estado.boloesPublicos = Array.isArray(dados.boloesPublicos) ? dados.boloesPublicos : estado.boloes.filter(b => String(b.tipo || 'PUBLICO').toUpperCase() === 'PUBLICO');
  estado.meusBoloesCriados = Array.isArray(dados.meusBoloesCriados) ? dados.meusBoloesCriados : estado.boloes.filter(b => b.souCriador);
  estado.boloesParticipando = Array.isArray(dados.boloesParticipando) ? dados.boloesParticipando : [];
  estado.usuarioAdmin = (dados.usuarioAdmin === true || String(dados.usuarioAdmin || '').toUpperCase() === 'SIM');

  // CORRECAO A: Nunca zera palpites locais ao receber dados da API.
  const palpitesLocaisAtual = carregarPalpitesLocais();
  const novosMeusPalpites = {};

  // Índice dos jogos atualmente carregados (para validar palpites locais)
  const idsJogosAtuais = {};
  estado.jogos.forEach(function(j) { idsJogosAtuais[String(j.id_jogo || j.id || '')] = true; });

  // 1) Palpites locais do bolão ativo: sem filtro de versão, apenas id_bolao + id_jogo + usuario
  Object.keys(palpitesLocaisAtual).forEach(function(k) {
    const p = palpitesLocaisAtual[k];
    if (!p) return;
    if (String(p.id_bolao || '') !== String(CONFIG.ID_BOLAO || '')) return;
    // V052: não descarta palpite local só porque o jogo saiu da lista aberta.
    // Jogos finalizados/fechados também precisam aparecer em Meus Palpites.
    const uidAtual = String(estado.usuario.idTelegram || '');
    const uidPalpite = String((p.usuario && p.usuario.idTelegram) || p.telegram_id || '');
    if (uidAtual && uidPalpite && uidAtual !== uidPalpite) return;
    // CORRECAO B: REMOVE o filtro de versão que descartava palpites válidos.
    // if (p.versao && String(p.versao) !== String(CONFIG.VERSAO)) return; // <-- REMOVIDO
    const normal = normalizarPalpiteApi({
      id_bolao: p.id_bolao,
      id_jogo: p.id_jogo,
      placarMandante: p.palpite && p.palpite.placarMandante,
      placarVisitante: p.palpite && p.palpite.placarVisitante,
      dataHora: p.dataHora,
      status: 'VALIDO'
    });
    if (normal && normal.id_jogo) novosMeusPalpites[k] = normal;
  });

  // 2) Mescla palpites vindos da API sem sobrescrever os locais (local tem prioridade)
  if (Array.isArray(dados.meusPalpites)) {
    dados.meusPalpites.forEach(function(p) {
      const normal = normalizarPalpiteApi(p);
      if (!normal || !normal.id_jogo) return;
      const k = String(normal.id_bolao || CONFIG.ID_BOLAO) + '|' + String(normal.id_jogo);
      if (!novosMeusPalpites[k]) novosMeusPalpites[k] = normal;
    });
  }

  // 3) Palpites embutidos em cada jogo (vindos do campo meuPalpite do jogo)
  estado.jogos.forEach(function(j) {
    if (j.meuPalpite && j.meuPalpite.id_jogo) {
      const k = String(j.id_bolao || CONFIG.ID_BOLAO) + '|' + String(j.id_jogo || j.id);
      if (!novosMeusPalpites[k]) novosMeusPalpites[k] = j.meuPalpite;
    }
  });

  estado.meusPalpites = novosMeusPalpites;
  salvarMeusPalpitesApiNoLocal();

  estado.jogo = jogoDestaqueHome();
  estado.cacheUsado = origem === 'cache';
  estado.cacheAtualizadoEm = dados.cacheAtualizadoEm || dados.dataCache || estado.cacheAtualizadoEm || '';
}


    function normalizarRankingItem(r){
      r=r||{};
      // CORRECAO: so exibe ranking se ha palpites processados (total_pontos vindo da API)
      // Evita exibir pontuacao falsa antes de qualquer jogo ter sido computado.
      var pontos=(r.total_pontos!==undefined&&r.total_pontos!==null&&r.total_pontos!=='')?Number(r.total_pontos):Number(r.pontos||0);
      if(Number.isNaN(pontos))pontos=0;
      return Object.assign({},r,{pontos:pontos,total_pontos:pontos});
    }

    function normalizarPalpiteApi(p){
      if(!p)return null;
      const idb=String(p.id_bolao||CONFIG.ID_BOLAO||'');
      const idj=String(p.id_jogo||p.id||'');
      if(!idj)return null;
      const pal=p.palpite||{};
      const pm=p.placarMandante!==undefined?p.placarMandante:(p.palpite_mandante!==undefined?p.palpite_mandante:pal.placarMandante);
      const pv=p.placarVisitante!==undefined?p.placarVisitante:(p.palpite_visitante!==undefined?p.palpite_visitante:pal.placarVisitante);
      if(pm===undefined||pv===undefined)return null;
      return {
        id_bolao:idb,
        id_jogo:idj,
        telegram_id:String(p.telegram_id||((p.usuario&&p.usuario.idTelegram)||'')),
        jogo:p.jogo||null,
        palpite:{placarMandante:pm,placarVisitante:pv},
        dataHora:p.dataHora||p.data_hora||'',
        status:p.status||'VALIDO',
        pontos:p.pontos||''
      };
    }

    function salvarMeusPalpitesApiNoLocal(){
      try{
        const mapa=carregarPalpitesLocais();
        Object.keys(estado.meusPalpites||{}).forEach(k=>{
          const p=estado.meusPalpites[k];
          const jogo=estado.jogos.find(j=>String(j.id_bolao||CONFIG.ID_BOLAO)===String(p.id_bolao||CONFIG.ID_BOLAO)&&String(j.id_jogo||j.id)===String(p.id_jogo));
          mapa[k]={tipo:'PALPITE_BOLAO_ESPORTIVO',versao:CONFIG.VERSAO,dataHora:p.dataHora||new Date().toISOString(),id_bolao:p.id_bolao,id_jogo:p.id_jogo,telegram_id:p.telegram_id||estado.usuario.idTelegram,usuario:estado.usuario,jogo:jogo||p.jogo||{},palpite:p.palpite};
        });
        localStorage.setItem(palpitesKey(),JSON.stringify(mapa));
      }catch(e){}
    }

    function salvarCache(dados){
      try{
        if(!dados)return;
        const pacote={salvoEm:Date.now(),versao:CONFIG.VERSAO,id_bolao:CONFIG.ID_BOLAO,dados:dados||{}};
        pacote.dados.cacheAtualizadoEm=new Date(pacote.salvoEm).toLocaleString('pt-BR');
        localStorage.setItem(cacheKey(),JSON.stringify(pacote));
        localStorage.setItem(cacheInfoKey(),JSON.stringify({salvoEm:pacote.salvoEm,versao:CONFIG.VERSAO}));
        estado.cacheAtualizadoEm=pacote.dados.cacheAtualizadoEm;
      }catch(e){console.warn('Não foi possível salvar cache local.',e)}
    }

    function carregarCache(){
      try{
        const keys=chavesCachePossiveis();
        for(const key of keys){
          const raw=localStorage.getItem(key);
          if(!raw)continue;
          const pacote=JSON.parse(raw);
          if(!pacote||!pacote.dados||!pacote.salvoEm)continue;
          const idadeHoras=(Date.now()-Number(pacote.salvoEm||0))/(60*60*1000);
          if(idadeHoras>Number(CONFIG.CACHE_MAX_HORAS||24))continue;
          pacote.dados.cacheAtualizadoEm=new Date(Number(pacote.salvoEm)).toLocaleString('pt-BR');
          aplicarDadosApi(pacote.dados,'cache');
          estado.carregando=false;
          estado.erroApi='';
          return true;
        }
      }catch(e){console.warn('Cache local inválido.',e)}
      return false;
    }

    function cacheRecente(){
      try{
        const raw=localStorage.getItem(cacheInfoKey());
        if(!raw)return false;
        const info=JSON.parse(raw);
        const idadeMin=(Date.now()-Number(info.salvoEm||0))/(60*1000);
        return idadeMin>=0&&idadeMin<Number(CONFIG.CACHE_TTL_MINUTOS||30);
      }catch(e){return false}
    }

    function palpitesKey() {
  // CORRECAO: chave fixa por usuário, não por bolão.
  // Assim palpites de todos os bolões ficam no mesmo mapa e não somem ao trocar de bolão.
  return 'PSS_MBE_PALPITES_' + String(estado.usuario.idTelegram || 'LOCAL');
}

    function palpiteKeyJogo(j){
      return String((j&&j.id_bolao)||CONFIG.ID_BOLAO||'BOLAO001')+'|'+String(idJogo(j));
    }

    function palpiteLocalValidoParaJogo(p,j){
      if(!p||!j)return false;
      if(String(p.id_bolao||'')!==String((j&&j.id_bolao)||CONFIG.ID_BOLAO||''))return false;
      if(String(p.id_jogo||'')!==String(idJogo(j)))return false;
      const uidAtual=String(estado.usuario.idTelegram||'');
      const uidPalpite=String((p.usuario&&p.usuario.idTelegram)||p.telegram_id||'');
      if(uidAtual && uidPalpite && uidAtual!==uidPalpite)return false;
      // Correção definitiva: não descarta palpite antigo apenas pela versão do index.
      // A validade real é id_bolao + id_jogo + usuário + placar preenchido.
      const pal=p.palpite||{};
      return pal.placarMandante!==undefined && pal.placarVisitante!==undefined;
    }

    function carregarPalpitesLocais() {
  try {
    // Tenta a chave nova (sem id_bolao)
    const raw = localStorage.getItem(palpitesKey());
    if (raw) {
      const mapa = JSON.parse(raw);
      if (mapa && typeof mapa === 'object') return mapa;
    }
    // Fallback: tenta chave antiga (com id_bolao) para não perder palpites já salvos
    const rawLegado = localStorage.getItem(
      'PSS_MBE_PALPITES_' + String(CONFIG.ID_BOLAO || 'BOLAO001') + '_' + String(estado.usuario.idTelegram || 'LOCAL')
    );
    if (rawLegado) {
      const mapaLegado = JSON.parse(rawLegado);
      if (mapaLegado && typeof mapaLegado === 'object') {
        // Migra para chave nova e remove a antiga
        try {
          localStorage.setItem(palpitesKey(), rawLegado);
          localStorage.removeItem(
            'PSS_MBE_PALPITES_' + String(CONFIG.ID_BOLAO || 'BOLAO001') + '_' + String(estado.usuario.idTelegram || 'LOCAL')
          );
        } catch(eMig) {}
        return mapaLegado;
      }
    }
  } catch(e) {
    console.warn('Cache de palpites inválido.', e);
  }
  return {};
}

    function getPalpiteLocal(j){
      if(!j)return null;
      const key=palpiteKeyJogo(j);
      if(estado.meusPalpites&&estado.meusPalpites[key]){
        const p=estado.meusPalpites[key];
        return {tipo:'PALPITE_BOLAO_ESPORTIVO',versao:CONFIG.VERSAO,dataHora:p.dataHora||'',id_bolao:p.id_bolao,id_jogo:p.id_jogo,usuario:estado.usuario,jogo:j,palpite:p.palpite};
      }
      if(j.meuPalpite){
        const p=normalizarPalpiteApi(j.meuPalpite);
        if(p&&String(p.id_bolao||'')===String((j&&j.id_bolao)||CONFIG.ID_BOLAO||'')&&String(p.id_jogo||'')===String(idJogo(j)))return {tipo:'PALPITE_BOLAO_ESPORTIVO',versao:CONFIG.VERSAO,dataHora:p.dataHora||'',id_bolao:p.id_bolao,id_jogo:p.id_jogo,telegram_id:p.telegram_id||estado.usuario.idTelegram,usuario:estado.usuario,jogo:j,palpite:p.palpite};
      }
      const mapa=carregarPalpitesLocais();
      const local=mapa[key]||null;
      return palpiteLocalValidoParaJogo(local,j)?local:null;
    }

    function salvarPalpiteLocal(payload) {
  try {
    const mapa = carregarPalpitesLocais();
    // CORRECAO: chave sempre inclui id_bolao para diferenciar palpites entre bolões
    // mesmo que palpitesKey() agora seja compartilhada por bolão.
    const key = String(payload.id_bolao || CONFIG.ID_BOLAO) + '|' + String(payload.id_jogo || '');
    mapa[key] = payload;
    estado.meusPalpites[key] = normalizarPalpiteApi({
      id_bolao: payload.id_bolao,
      id_jogo: payload.id_jogo,
      placarMandante: payload.palpite.placarMandante,
      placarVisitante: payload.palpite.placarVisitante,
      dataHora: payload.dataHora,
      status: 'VALIDO'
    });
    localStorage.setItem(palpitesKey(), JSON.stringify(mapa));
    localStorage.setItem('ultimo_palpite_bolao_esportivo', JSON.stringify(payload));
  } catch(e) {
    console.warn('Não foi possível salvar palpite local.', e);
  }
}

    function resultadoPorPlacar(gm,gv){
      gm=Number(gm);gv=Number(gv);
      if(gm>gv)return 'MANDANTE';
      if(gv>gm)return 'VISITANTE';
      return 'EMPATE';
    }

    function textoPalpiteLocal(p){
      if(!p)return '';
      const pal=p.palpite||p;
      const a=pal.placarMandante!==undefined?pal.placarMandante:pal.palpite_mandante;
      const b=pal.placarVisitante!==undefined?pal.placarVisitante:pal.palpite_visitante;
      if(a===undefined||b===undefined)return '';
      return `${a} x ${b}`;
    }

    function parseDataHoraJogo(j){
      if(!j)return null;
      const base=String((j.limitePalpite&&j.limitePalpite!=='')?j.limitePalpite:((j.data||'')+' '+(j.hora||''))).trim();
      let m=base.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s*(?:às)?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?)?/i);
      if(m){
        const d=new Date(Number(m[3]),Number(m[2])-1,Number(m[1]),Number(m[4]||0),Number(m[5]||0),Number(m[6]||0));
        return Number.isNaN(d.getTime())?null:d;
      }
      const d=new Date(base);
      return Number.isNaN(d.getTime())?null:d;
    }

    function textoTempoRestante(j){
      const alvo=parseDataHoraJogo(j);
      if(!alvo)return '';
      let ms=alvo.getTime()-Date.now();
      if(ms<=0)return 'encerrado';
      let total=Math.floor(ms/1000);
      const d=Math.floor(total/86400);total-=d*86400;
      const h=Math.floor(total/3600);total-=h*3600;
      const m=Math.floor(total/60);const s=total-(m*60);
      const hh=String(h).padStart(2,'0'), mm=String(m).padStart(2,'0'), ss=String(s).padStart(2,'0');
      return d>0?`${d}d ${hh}h ${mm}m ${ss}s`:`${hh}h ${mm}m ${ss}s`;
    }

    function textoDataHoraStatus(j){
      const data=esc(j&&j.data?j.data:'--/--/----');
      const horaJ=esc(j&&j.hora?j.hora:'--:--');
      return `📅 ${data} às ${horaJ} • <span class="chip">${esc(statusJogo(j))}</span>`;
    }

    function htmlTempoParaPalpitar(j){
      if(!isAberto(j))return '';
      const t=textoTempoRestante(j);
      return t?`<p class="countdown">⏳ Tempo para palpitar: <b data-countdown-jogo="${esc(idJogo(j))}">${esc(t)}</b></p>`:'';
    }

    function htmlLinhaTimesJogo(j){
      return `<strong class="game-teams-line"><span class="home">${flagHtml(j,'mandante')} <span class="team-name">${esc(j.mandante)}</span></span><span class="x">${textoPlacarJogo(j)}</span><span class="away"><span class="team-name">${esc(j.visitante)}</span> ${flagHtml(j,'visitante').replace('inline-flag','inline-flag right')}</span></strong>`;
    }

    function proximoJogoParaPalpitar(jAtual){
      const abertos=estado.jogos.filter(j=>isAberto(j)&&!getPalpiteLocal(j));
      if(!abertos.length)return null;
      const atualId=idJogo(jAtual||estado.jogo);
      if(!atualId)return abertos[0];
      const idx=estado.jogos.findIndex(j=>idJogo(j)===atualId);
      for(let i=idx+1;i<estado.jogos.length;i++){
        const j=estado.jogos[i];
        if(isAberto(j)&&!getPalpiteLocal(j))return j;
      }
      return abertos[0];
    }

    function iniciarTimerRegressivoModal(){
      const els=[...document.querySelectorAll('[data-countdown-jogo]')];

    function millisJogo(j){
      if(!j)return Infinity;
      var d=parseDataHoraJogo(j);
      return d?d.getTime():Infinity;
    }
    function jogoDestaqueHome(){
      // CORRECAO: exibe o proximo jogo a ocorrer em ordem cronologica.
      // Se todos finalizados/cancelados, exibe o primeiro da lista.
      var lista=(estado.jogos||[]).slice().sort(function(a,b){return millisJogo(a)-millisJogo(b)});
      var agora=Date.now();
      // Prioridade 1: jogo aberto (mais proximo do inicio)
      for(var i=0;i<lista.length;i++){
        var j=lista[i];
        if(isAberto(j))return j;
      }
      // Prioridade 2: proximo jogo futuro que ainda nao encerrou
      for(var i=0;i<lista.length;i++){
        var j=lista[i];
        var st=statusJogo(j).toUpperCase();
        if(st!=='FINALIZADO'&&st!=='CANCELADO'){
          var ms=millisJogo(j);
          if(ms===Infinity||ms>agora)return j;
        }
      }
      // Prioridade 3: o mais proximo do inicio mesmo que passado
      for(var i=0;i<lista.length;i++){
        var j=lista[i];
        var st=statusJogo(j).toUpperCase();
        if(st!=='FINALIZADO'&&st!=='CANCELADO')return j;
      }
      return lista[0]||null;
    }

    async function confirmarPalpite(auto){
      const j=estado.jogo;

      if(Number.isNaN(gm)||Number.isNaN(gv)||gm<0||gv<0||gm>30||gv>30){toastMsg('Informe um placar válido entre 0 e 30.');return false}

      const payload={
        tipo:'PALPITE_BOLAO_ESPORTIVO',
        versao:CONFIG.VERSAO,
        dataHora:new Date().toISOString(),
        id_bolao:j.id_bolao||CONFIG.ID_BOLAO,

        usuario:estado.usuario,
        jogo:j,
        palpite:{resultado:resultadoPorPlacar(gm,gv),placarMandante:gm,placarVisitante:gv}

    async function enviar(payload){
      // V028: grava primeiro pela API JSONP, sempre usando id_bolao + id_jogo + telegram_id.
      // Isso impede que um palpite de um bolão seja reaproveitado indevidamente em outro.
      try{
        const r=await chamarApiAcao('salvarPalpiteMiniApp',{
          id_bolao:payload.id_bolao,
          id_jogo:payload.id_jogo,
          telegram_id:estado.usuario.idTelegram,
          nome:estado.usuario.nome,
          username:estado.usuario.username,
          placar_mandante:payload.palpite.placarMandante,
          placar_visitante:payload.palpite.placarVisitante
        });
        if(r&&r.ok)return 'API';
        throw new Error((r&&r.mensagem)||(r&&r.erro)||'API não confirmou o palpite.');
      }catch(e){
        console.warn('Falha ao gravar palpite pela API, tentando fallback Telegram.',e);
        if(tg&&CONFIG.ENVIAR_AO_BOT_SEM_API&&typeof tg.sendData==='function'){
          tg.sendData(JSON.stringify(payload));
          return 'BOT';
        }
        throw e;
      }
    }

    /***********************
     * COPA — GRUPOS, JOGOS E CHAVEAMENTO
     * Usa somente os jogos já carregados no JSON estático do bolão atual.

    function flagTimeHtml(nome){
      const code=codigoPais(nome);
      return code?'<img class="inline-flag" src="'+flagUrl(code)+'" alt="'+esc(nome)+'">':'⚽';
    }

    function golsNumero(v){
      if(v===null||v===undefined||v==='')return null;
      const n=Number(v);
      return isNaN(n)?null:n;
    }

    function temResultadoCopa(j){
      return golsNumero(j&&j.gols_mandante)!==null && golsNumero(j&&j.gols_visitante)!==null;
    }

    function nomeFaseCopa(j){
      return String((j&&j.fase)||j&&j.rodada_camp||j&&j.rodada_bolao||'').trim();
    }

    function jogosOrdenadosCopa(){
      return (estado.jogos||[]).slice().sort(function(a,b){return millisJogo(a)-millisJogo(b)});
    }

    function letraGrupoCopa(nome){
      const s=String(nome||'').trim();
      const m=s.match(/(?:grupo|group)\s*([A-L])/i)||s.match(/\b([A-L])\b/i);
      return m?m[1].toUpperCase():'';
    }

    function ordenarGruposCopa(a,b){
      const la=letraGrupoCopa(a&&a.nome), lb=letraGrupoCopa(b&&b.nome);
      if(la&&lb)return la.localeCompare(lb);
      return String(a&&a.nome||'').localeCompare(String(b&&b.nome||''));
    }

    function jogosGrupoCandidatos(){
      const jogos=jogosOrdenadosCopa();
      const marcados=jogos.filter(function(j){
        const txt=normalizarChave([j.grupo,j.fase,j.rodada_camp,j.status].join(' '));
        return txt.indexOf('GRUPO')>=0 || txt.indexOf('GROUP')>=0;
      });
      if(marcados.length)return marcados;
      // Copa 2026: 12 grupos x 6 jogos = 72 jogos de fase de grupos.
      return jogos.slice(0, Math.min(72,jogos.length));
    }

    function montarGruposCopa(){
      const candidatos=jogosGrupoCandidatos();
      if(!candidatos.length)return [];
      const gruposCampo={};
      candidatos.forEach(function(j){
        const g=String(j.grupo||'').trim();
        if(g){
          const nome=/^grupo/i.test(g)?g:'Grupo '+g;
          if(!gruposCampo[nome])gruposCampo[nome]={nome:nome,times:{},jogos:[]};
          gruposCampo[nome].jogos.push(j);
          gruposCampo[nome].times[normalizarTextoPais(j.mandante)]=j.mandante;
          gruposCampo[nome].times[normalizarTextoPais(j.visitante)]=j.visitante;
        }
      });
      if(Object.keys(gruposCampo).length){
        return Object.values(gruposCampo).map(function(g){g.times=Object.values(g.times);return g}).sort(ordenarGruposCopa);
      }

      // Sem coluna de grupo: monta grupos por componentes de confrontos da fase inicial.
      const adj={}, nomes={}, first={};
      candidatos.forEach(function(j,idx){
        const a=normalizarTextoPais(j.mandante), b=normalizarTextoPais(j.visitante);
        if(!a||!b)return;
        nomes[a]=j.mandante; nomes[b]=j.visitante;
        if(first[a]===undefined)first[a]=idx;
        if(first[b]===undefined)first[b]=idx;
        (adj[a]=adj[a]||{})[b]=true;
        (adj[b]=adj[b]||{})[a]=true;
      });
      const visit={}, comps=[];
      Object.keys(nomes).forEach(function(t){
        if(visit[t])return;
        const stack=[t], comp=[]; visit[t]=true;
        while(stack.length){
          const x=stack.pop(); comp.push(x);
          Object.keys(adj[x]||{}).forEach(function(y){if(!visit[y]){visit[y]=true;stack.push(y)}});
        }
        comps.push(comp);
      });
      comps.sort(function(a,b){
        const ia=Math.min.apply(null,a.map(function(x){return first[x]||0}));
        const ib=Math.min.apply(null,b.map(function(x){return first[x]||0}));
        return ia-ib;
      });
      const letras='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
      const grupos=comps.map(function(comp,i){
        const set={}; comp.forEach(function(x){set[x]=true});
        const jogos=candidatos.filter(function(j){return set[normalizarTextoPais(j.mandante)]&&set[normalizarTextoPais(j.visitante)]});
        const times=comp.map(function(x){return nomes[x]}).sort(function(a,b){return a.localeCompare(b)});
        return {nome:'Grupo '+(letras[i]||String(i+1)),times:times,jogos:jogos};
      }).filter(function(g){return g.times.length||g.jogos.length});
      return grupos.sort(ordenarGruposCopa);
    }

    function tabelaGrupoCopa(g){
      const mapa={};
      function ensure(t){
        const k=normalizarTextoPais(t);
        if(!mapa[k])mapa[k]={time:t,j:0,v:0,e:0,d:0,gp:0,gc:0,sg:0,pts:0};
        return mapa[k];
      }
      (g.times||[]).forEach(ensure);
      (g.jogos||[]).forEach(function(j){
        const gm=golsNumero(j.gols_mandante), gv=golsNumero(j.gols_visitante);
        ensure(j.mandante); ensure(j.visitante);
        if(gm===null||gv===null)return;
        const a=ensure(j.mandante), b=ensure(j.visitante);
        a.j++; b.j++; a.gp+=gm; a.gc+=gv; b.gp+=gv; b.gc+=gm; a.sg=a.gp-a.gc; b.sg=b.gp-b.gc;
        if(gm>gv){a.v++;a.pts+=3;b.d++;}
        else if(gm<gv){b.v++;b.pts+=3;a.d++;}
        else {a.e++;b.e++;a.pts++;b.pts++;}
      });
      return Object.values(mapa).sort(function(a,b){return (b.pts-a.pts)||(b.sg-a.sg)||(b.gp-a.gp)||a.time.localeCompare(b.time)});
    }

    function grupoCompletoCopa(g){
      const js=g&&g.jogos?g.jogos:[];
      return js.length>=3 && js.every(temResultadoCopa);
    }

    function mapaGruposCopa(grupos){
      const mapa={};
      (grupos||[]).forEach(function(g){
        const l=letraGrupoCopa(g.nome);
        if(l)mapa[l]=g;
      });
      return mapa;
    }

    function slotGrupoFifaCopa(tipo,letra,mapa){
      const g=mapa[letra];
      const pos=tipo==='1'?0:tipo==='2'?1:2;
      if(g){
        const r=tabelaGrupoCopa(g)[pos];
        if(r&&r.time)return flagTimeHtml(r.time)+' '+esc(r.time)+' <small style="opacity:.7">(provisório)</small>';
      }
      if(tipo==='1')return '1º Grupo '+esc(letra);
      if(tipo==='2')return '2º Grupo '+esc(letra);
      return '3º Grupo '+esc(letra);
    }

    function slotTerceiroFifaCopa(pool){
      const grupos=montarGruposCopa();
      const mapa=mapaGruposCopa(grupos);
      const thirds=[];
      (pool||[]).forEach(function(letra){const g=mapa[letra]; if(!g)return; const r=tabelaGrupoCopa(g)[2]; if(r&&r.time)thirds.push({letra:letra,time:r.time,pts:r.pts,sg:r.sg,gp:r.gp});});
      thirds.sort(function(a,b){return (b.pts-a.pts)||(b.sg-a.sg)||(b.gp-a.gp)||String(a.time).localeCompare(String(b.time));});
      if(thirds[0])return flagTimeHtml(thirds[0].time)+' '+esc(thirds[0].time)+' <small style="opacity:.7">(melhor 3º provisório)</small>';
      return 'Melhor 3º '+esc(pool.join('/'));
    }

    const COPA_FIFA_QF=[['97','89','90'],['98','93','94'],['99','91','92'],['100','95','96']];
    const COPA_FIFA_SF=[['101','97','98'],['102','99','100']];
    const COPA_FIFA_FINAL=[['103','Perdedor 101','Perdedor 102','3º lugar'],['104','Vencedor 101','Vencedor 102','Final']];

    function htmlSlotFifaCopa(slot,mapa){
      if(slot[0]==='3')return slotTerceiroFifaCopa(slot[1]);
      return slotGrupoFifaCopa(slot[0],slot[1],mapa);
    }

    function htmlDuelCardCopa(titulo,a,b,nota){
      return '<div class="copa-bracket-card"><strong>'+esc(titulo)+'</strong><div class="copa-duelo"><span>'+a+'</span><span class="meio">x</span><span>'+b+'</span></div>'+(nota?'<p class="copa-nota">'+nota+'</p>':'')+'</div>';
    }

    function htmlJogoCopaLinha(j,opcoes){
      opcoes=opcoes||{};
      const placar=temResultadoCopa(j)
        ? '<span class="score-gm">'+esc(j.gols_mandante)+'</span><span class="score-x">x</span><span class="score-gv">'+esc(j.gols_visitante)+'</span>'
        : '<span class="score-gm"></span><span class="score-x">x</span><span class="score-gv"></span>';
      const quando=(j.data||'')+(j.hora?' às '+j.hora:'');
      const fase=(!opcoes.semFase&&nomeFaseCopa(j))?' <span class="chip">'+esc(nomeFaseCopa(j))+'</span>':'';
      return '<div class="mini"><div class="game-card-head">📅 '+esc(quando||'Data a definir')+fase+'</div><div class="game-teams-line"><span class="home">'+flagTimeHtml(j.mandante)+' <span class="team-name">'+esc(j.mandante)+'</span></span><span class="x game-score">'+placar+'</span><span class="away"><span class="team-name">'+esc(j.visitante)+'</span> '+flagTimeHtml(j.visitante)+'</span></div></div>';
    }

    function htmlCopaTabs(tab){
      const tabs=[['grupos','Grupos'],['jogos','Jogos'],['classificacao','Classificação'],['chaveamento','Chaveamento']];
      return '<div class="opts">'+tabs.map(function(t){return '<button class="opt '+(tab===t[0]?'active':'')+'" data-copa-tab="'+t[0]+'"><span>'+t[1]+'</span><span>›</span></button>'}).join('')+'</div>';
    }

    function htmlGrupoCardCopa(g){
      const times=(g.times||[]).map(function(t){return '<div class="copa-time-row">'+flagTimeHtml(t)+' <span>'+esc(t)+'</span></div>'}).join('');
      return '<div class="copa-grupo-card"><div class="copa-grupo-head"><strong>'+esc(g.nome)+'</strong><span class="chip">'+(g.jogos||[]).length+' jogos</span></div><div class="copa-time-list">'+times+'</div></div>';
    }

    function htmlClassificacaoGrupoCopa(g){
      const linhas=tabelaGrupoCopa(g).map(function(r,idx){
        return '<div class="copa-class-row"><span class="copa-class-cell">'+(idx+1)+'</span><span class="sel">'+flagTimeHtml(r.time)+' <span>'+esc(r.time)+'</span></span><span class="copa-class-cell">'+r.pts+'</span><span class="copa-class-cell">'+r.j+'</span><span class="copa-class-cell extra">'+r.v+'</span><span class="copa-class-cell extra">'+r.e+'</span><span class="copa-class-cell extra">'+r.d+'</span><span class="copa-class-cell extra">'+r.gp+'</span><span class="copa-class-cell extra">'+r.gc+'</span><span class="copa-class-cell">'+r.sg+'</span></div>';
      }).join('');
      const header='<div class="copa-class-row header"><span>#</span><span>Seleção</span><span>P</span><span>J</span><span class="copa-class-cell extra">V</span><span class="copa-class-cell extra">E</span><span class="copa-class-cell extra">D</span><span class="copa-class-cell extra">GP</span><span class="copa-class-cell extra">GC</span><span>SG</span></div>';
      return '<div class="mini"><strong>'+esc(g.nome)+'</strong><div class="copa-class-table">'+header+linhas+'</div></div>';
    }

    function htmlChaveamentoFifaCopa(grupos){
      const mapa=mapaGruposCopa(grupos);
      let html='<div class="mini"><strong>🔀 Chaveamento FIFA 2026</strong><p>Os cruzamentos abaixo seguem a estrutura oficial da Copa do Mundo 2026. Durante a fase de grupos, os nomes exibidos são provisórios e mudam automaticamente conforme os placares em andamento.</p></div>';
      html+='<div class="mini"><strong>Rodada de 32</strong></div><div class="copa-bracket">'+COPA_FIFA_RO32.map(function(x){return htmlDuelCardCopa('Jogo '+x.m,htmlSlotFifaCopa(x.a,mapa),htmlSlotFifaCopa(x.b,mapa),'');}).join('')+'</div>';
      html+='<div class="mini"><strong>Oitavas de final</strong></div><div class="copa-bracket">'+COPA_FIFA_R16.map(function(x){return htmlDuelCardCopa('Jogo '+x[0],'Vencedor '+x[1],'Vencedor '+x[2],'');}).join('')+'</div>';
      html+='<div class="mini"><strong>Quartas de final</strong></div><div class="copa-bracket">'+COPA_FIFA_QF.map(function(x){return htmlDuelCardCopa('Jogo '+x[0],'Vencedor '+x[1],'Vencedor '+x[2],'');}).join('')+'</div>';
      html+='<div class="mini"><strong>Semifinais / decisão</strong></div><div class="copa-bracket">'+COPA_FIFA_SF.map(function(x){return htmlDuelCardCopa('Jogo '+x[0],'Vencedor '+x[1],'Vencedor '+x[2],'');}).join('')+COPA_FIFA_FINAL.map(function(x){return htmlDuelCardCopa('Jogo '+x[0]+' — '+x[3],x[1],x[2],'');}).join('')+'</div>';
      return html;
    }

    function abrirCopa(tab){
      tab=tab||'grupos';
      const grupos=montarGruposCopa();
      let corpo='<div class="mini"><strong>🏆 Copa do Mundo</strong><p>Grupos, jogos, classificação e chaveamento gerados pelo JSON estático. Jogos finalizados e placares ao vivo também entram no cálculo provisório automaticamente.</p></div>'+htmlCopaTabs(tab);
      if(!grupos.length){
        corpo+=telaVazia('Nenhum jogo disponível para montar grupos da Copa neste momento.');
      }else if(tab==='grupos'){
        corpo+='<div class="copa-grupos-grid">'+grupos.map(htmlGrupoCardCopa).join('')+'</div>';
      }else if(tab==='jogos'){
        corpo+=grupos.map(function(g){return '<div class="mini"><strong>'+esc(g.nome)+'</strong><p>Jogos da fase de grupos.</p></div>'+g.jogos.slice().sort(function(a,b){return millisJogo(a)-millisJogo(b)}).map(function(j){return htmlJogoCopaLinha(j,{semFase:true})}).join('')}).join('');
      }else if(tab==='classificacao'){
        corpo+=grupos.map(htmlClassificacaoGrupoCopa).join('');
      }else if(tab==='chaveamento'){
        const usados={}; grupos.forEach(function(g){(g.jogos||[]).forEach(function(j){usados[idJogo(j)]=true})});
        const mata=jogosOrdenadosCopa().filter(function(j){return !usados[idJogo(j)]});
        if(mata.length){
          corpo+='<div class="mini"><strong>Jogos de mata-mata já presentes na base</strong><p>Quando a base trouxer confrontos reais das próximas fases, eles aparecem aqui automaticamente.</p></div>'+mata.map(function(j){return htmlJogoCopaLinha(j,{semFase:false})}).join('');
        }
        corpo+=htmlChaveamentoFifaCopa(grupos);
      }
      openModal('🏆 Copa',corpo,'<button class="btn light" id="abrirRegulamentoCopa">Regulamento</button><button class="btn primary" id="fecharCopa">Fechar</button>');
      document.querySelectorAll('[data-copa-tab]').forEach(function(btn){btn.onclick=function(){abrirCopa(btn.dataset.copaTab)}});
      var fechar=document.getElementById('fecharCopa'); if(fechar)fechar.onclick=closeModal;
      var reg=document.getElementById('abrirRegulamentoCopa'); if(reg)reg.onclick=function(){screen('regulamento')};
    }

    function screen(name){
      if(name==='boloes'){
        // V031: diferencia claramente modo publico (navegador) de modo Telegram identificado.
        // O JSON publico abre rapido, mas dados privados dependem do Telegram ID/API.
        const identificado=!!String(estado.usuario.idTelegram||'').trim();
        const adminAtual=estado.usuarioAdmin===true;
        const emTelegram=!!(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&estado.usuario.idTelegram);

        // V037: a tela de bolões não consulta mais API automaticamente.
        // Ela usa o perfil JSON já carregado para evitar timeout e falso erro.

        var todosBoloes=Array.isArray(estado.boloes)?estado.boloes:[];
        var boloesPublicos=Array.isArray(estado.boloesPublicos)?estado.boloesPublicos:todosBoloes.filter(function(b){return String(b.tipo||b.tipo_bolao||'PUBLICO').toUpperCase()==='PUBLICO'});
        var meusCriados=Array.isArray(estado.meusBoloesCriados)?estado.meusBoloesCriados:[];
        var participando=Array.isArray(estado.boloesParticipando)?estado.boloesParticipando:[];

        // Admin identificado deve ver todos os bolões administráveis na seção de criados/administrados.
        if(adminAtual && todosBoloes.length)meusCriados=todosBoloes.slice();

        if(!meusCriados.length&&todosBoloes.length&&identificado){
          var fallbackCriados=todosBoloes.filter(function(b){return !!b.souCriador});
          if(fallbackCriados.length)meusCriados=fallbackCriados;
        }

        var avisoUsuario=!identificado?'<div class="mini" style="border-color:rgba(212,166,60,.55);background:#fffdf4"><strong>⚠️ Modo público: usuário não identificado</strong><p>Esta abertura está fora do Mini App do Telegram ou sem identificação. Por segurança, aqui aparecem apenas bolões públicos. Para ver seus bolões criados, bolões privados e participações, abra pelo botão do Telegram.</p><button class="mini-action" id="abrirTelegramOficial">Abrir pelo Telegram</button></div>':'';
        var avisoSync=(identificado&&estado.sincronizandoBoloes)?'<div class="mini" style="border-color:rgba(10,90,53,.35);background:#f0fff4"><strong>🔄 Sincronizando seus bolões com a planilha...</strong><p>O JSON público abre rápido; seus bolões privados/criados só aparecem depois da consulta real com seu Telegram ID.</p></div>':'';
        var avisoPrivado='';
        if(identificado && !estado.sincronizandoBoloes && !meusCriados.length && !participando.length){
          avisoPrivado='<div class="mini" style="border-color:rgba(212,166,60,.35);background:#fffdf4"><strong>⚠️ Nenhum bolão privado vinculado ao seu Telegram ID</strong><p>Se você criou bolões e eles não apareceram, confira se o criador_telegram_id/inscrição na planilha está com o mesmo ID do Telegram usado para abrir este Mini App.</p><button class="mini-action secondary" id="atualizarBoloesApiTopo">Recarregar JSON do perfil</button></div>';
        }

        var secoesPrivadas='';
        if(identificado){
          secoesPrivadas+=montarSecaoBoloes(adminAtual?'🔐 Bolões administrados':'🔐 Meus bolões criados', meusCriados, true);
          if(participando.length)secoesPrivadas+=montarSecaoBoloes('👥 Bolões que participo', participando, false);
        }else{
          secoesPrivadas+='<div class="mini"><strong>🔐 Área privada protegida</strong><p>Meus bolões criados e bolões que participo só aparecem quando o Telegram identifica o participante.</p></div>';
        }

        var bodyBoloes=
          avisoUsuario+avisoSync+
          (estado.bolaoAtual?'<div class="mini" style="border-color:rgba(10,90,53,.4);background:#f0fff4"><strong>✅ Bolão ativo: '+esc(estado.bolaoAtual.nome_bolao||CONFIG.ID_BOLAO)+'</strong><p>'+esc(tipoBolaoSeguro(estado.bolaoAtual))+
          (estado.bolaoAtual.codigo_convite&&estado.bolaoAtual.codigo_convite!=='PUBLICO'?'&nbsp;•&nbsp;Código: <b>'+esc(estado.bolaoAtual.codigo_convite)+'</b>':'')+
          '</p></div>':'')+
          montarSecaoBoloes('🌎 Bolões públicos', boloesPublicos, true)+
          secoesPrivadas+
          avisoPrivado+
          '<div class="mini"><strong>Criar ou entrar em bolão</strong><p>Crie bolões privados para trabalho, família ou amigos. Cada bolão tem ranking e código de convite separados.</p><button class="mini-action secondary" id="atualizarBoloesApi">🔄 Recarregar JSON do perfil</button></div>';
        openModal('🏆 Bolões',bodyBoloes,'<button class="btn light" id="entrarCodigo">Entrar com Código</button><button class="btn primary" id="criarBolao">Criar Bolão</button>');
        ligarEventosBoloes();
        entrarCodigo.onclick=abrirEntrarCodigo;
        criarBolao.onclick=abrirCriarBolao;
        var abrirTel=document.getElementById('abrirTelegramOficial');
        if(abrirTel)abrirTel.onclick=function(){window.location.href=CONFIG.TELEGRAM_MINIAPP_OFICIAL};
        function atualizarBoloesAgora(){estado.sincronizandoBoloes=true;screen('boloes');carregarJsonPublicoPerfilEstatico().then(function(){estado.sincronizandoBoloes=false;screen('boloes');toastMsg('JSON do perfil recarregado.');}).catch(function(e){estado.sincronizandoBoloes=false;screen('boloes');toastMsg('Não foi possível recarregar o JSON agora.');})}
        var btnAtualizar=document.getElementById('atualizarBoloesApi');
        if(btnAtualizar)btnAtualizar.onclick=atualizarBoloesAgora;
        var btnAtualizarTopo=document.getElementById('atualizarBoloesApiTopo');
        if(btnAtualizarTopo)btnAtualizarTopo.onclick=atualizarBoloesAgora;
        return;
      }

      if(name==='jogos'){
        // CORRECAO: lista em ordem cronologica (proximo a iniciar primeiro)
        var jogosOrdenados=(estado.jogos||[]).slice().sort(function(a,b){return millisJogo(a)-millisJogo(b)});
        var palpitados=jogosOrdenados.filter(function(j){return !!getPalpiteLocal(j)});
        var pendentes=jogosOrdenados.filter(function(j){return isAberto(j)&&!getPalpiteLocal(j)});
        var resumo=jogosOrdenados.length?htmlBolaoContexto('Palpites e ranking separados por bolão.')+'<div class="pendentes-box"><b>'+jogosOrdenados.length+'</b> jogo(s) carregado(s) neste bolão.<br><b>'+pendentes.length+'</b> ainda sem palpite aberto.<br><b>'+palpitados.length+'</b> já palpitado(s) por você neste bolão.</div>':htmlBolaoContexto('Palpites e ranking separados por bolão.');
        var bodyJogos=jogosOrdenados.length?resumo+jogosOrdenados.map(function(j){
          var p=getPalpiteLocal(j);
          return '<div class="mini '+(p?'ja-palpitado':'')+'"><div class="game-card-head">'+textoDataHoraStatus(j)+'</div>'+htmlLinhaTimesJogo(j)+(p?'<p class="saved-pick">'+esc(textoPalpitePrivado(p,j))+'</p>':htmlTempoParaPalpitar(j))+'<div class="mini-actions">'+(isAberto(j)?'<button class="mini-action" data-palpitar-jogo="'+esc(idJogo(j))+'">'+(p?'Alterar palpite':'Fazer palpite')+'</button>':'')+'<button class="mini-action secondary" data-select-jogo="'+esc(idJogo(j))+'">Selecionar</button></div></div>';
        }).join(''):telaVazia(estado.erroApi||'Nenhum jogo foi retornado pela API.');
        openModal('📅 Jogos',bodyJogos);
        iniciarTimerRegressivoModal();
        document.querySelectorAll('[data-select-jogo]').forEach(function(b){b.onclick=function(){selecionarJogoPorId(b.dataset.selectJogo)}});
        document.querySelectorAll('[data-palpitar-jogo]').forEach(function(b){b.onclick=function(){var j=estado.jogos.find(function(x){return idJogo(x)===String(b.dataset.palpitarJogo)});if(j){estado.jogo=j;render();closeModal();setTimeout(function(){abrirPalpite()},120)}}});
        return;
      }

      if(name==='ranking'){
        var provis=String(estado.rankingTipo||'').toUpperCase()==='PROVISORIO';
        var rankMod=provis?estado.ranking:estado.ranking.filter(function(r){return Number(r.total_pontos||r.pontos||0)>0});
        var legenda=provis?'Ranking ao vivo/provisório. Pode mudar até o fim da partida.':'Ranking exclusivo deste bolão.';
        var bodyRank=rankMod.length?((provis?'<div class="mini"><strong>🔴 Ao vivo / provisório</strong><p>Calculado com o placar em andamento. Será confirmado após o resultado final.</p></div>':'')+rankMod.map(function(r){
          return '<div class="mini"><strong>'+esc(r.pos)+'º — '+esc(r.nome)+'</strong><p>'+esc((r.total_pontos!==undefined?r.total_pontos:r.pontos)||0)+' pontos '+esc(r.medalha||'🏅')+'</p></div>';
        }).join('')):telaVazia('Ainda não há pontuação calculada. O ranking será exibido automaticamente após os resultados dos jogos serem processados.');
        return openModal('🏆 Ranking do Bolão',htmlBolaoContexto(legenda)+bodyRank);
      }

      if(name==='copa')return abrirCopa('grupos');

      if(name==='regulamento')return openModal('📄 Regulamento',htmlBolaoContexto('Regras aplicadas ao bolão ativo.')+`<div class="mini"><strong>Regras principais</strong><p>1. Cada participante registra o palpite por placar antes do fechamento do jogo.</p><p>2. O participante vê o próprio palpite a qualquer momento.</p><p>3. Palpites de outros participantes só ficam visíveis após o fechamento/início definido para o jogo.</p><p>4. A pontuação será calculada automaticamente após os placares reais serem sincronizados.</p><p>5. Cada bolão privado tem código de convite, participantes e ranking próprios.</p></div>`);

      if(name==='palpites'){
        // CORRECAO: exibir palpites em ordem cronologica dos jogos (nao pela data do palpite)
        var mapa=carregarPalpitesLocais();
        var uidAtual=String(estado.usuario.idTelegram||'');
        var apiItens=Object.keys(estado.meusPalpites||{}).map(function(k){return estado.meusPalpites[k]}).filter(function(p){return String(p.id_bolao||CONFIG.ID_BOLAO)===String(CONFIG.ID_BOLAO)});
        var localItens=Object.values(mapa).filter(function(p){
          if(!p)return false;
          if(String(p.id_bolao||'')!==String(CONFIG.ID_BOLAO||''))return false;
          var uidPalpite=String((p.usuario&&p.usuario.idTelegram)||p.telegram_id||'');
          if(uidAtual&&uidPalpite&&uidAtual!==uidPalpite)return false;
          return true;
        }).map(function(p){return normalizarPalpiteApi({id_bolao:p.id_bolao,id_jogo:p.id_jogo,telegram_id:(p.usuario&&p.usuario.idTelegram)||p.telegram_id||'',placarMandante:p.palpite&&p.palpite.placarMandante,placarVisitante:p.palpite&&p.palpite.placarVisitante,dataHora:p.dataHora,status:'VALIDO'})}).filter(Boolean);
        var todos={};apiItens.concat(localItens).forEach(function(p){todos[String(p.id_bolao)+'|'+String(p.id_jogo)]=p});
        // Ordena pela data do jogo (ordem cronologica)
        var itens=Object.values(todos).sort(function(a,b){
          var ja=estado.jogos.find(function(j){return String(j.id_jogo||j.id)===String(a.id_jogo)});
          var jb=estado.jogos.find(function(j){return String(j.id_jogo||j.id)===String(b.id_jogo)});
          var ma=ja?millisJogo(ja):Infinity;
          var mb=jb?millisJogo(jb):Infinity;
          return ma-mb;
        });
        var bodyPal=itens.length?itens.map(function(u){
          var jAtual=estado.jogos.find(function(j){return String(j.id_jogo||j.id)===String(u.id_jogo)})||u.jogo||{};
          var linhaResultado=temPlacarJogo(jAtual)?'<p><b>Resultado:</b> '+textoPlacarJogo(jAtual)+'</p>':'';
          return '<div class="mini ja-palpitado"><strong>'+flagHtml(jAtual,'mandante')+' '+esc(jAtual.mandante||u.mandante||'Mandante')+' x '+esc(jAtual.visitante||u.visitante||'Visitante')+' '+flagHtml(jAtual,'visitante')+'</strong><p>'+esc(jAtual.data||'')+(jAtual.hora?' às '+esc(jAtual.hora):'')+' <span class="chip">'+esc(statusJogo(jAtual))+'</span></p>'+linhaResultado+'<p class="saved-pick">Meu palpite: '+esc(textoPalpiteLocal(u))+'</p></div>';
        }).join(''):'<div class="mini"><strong>Nenhum palpite registrado.</strong><p>Abra um jogo e digite o placar. Ao preencher os dois campos, o palpite será salvo automaticamente.</p></div>';
        openModal('🎯 Meus Palpites',htmlBolaoContexto('Lista de palpites somente deste bolão ativo.')+bodyPal,'<button class="btn light" id="ok">Fechar</button><button class="btn primary" id="novo">▶ Próximo sem palpite</button>');
        setTimeout(function(){
          var btnNovo=document.getElementById('novo');
          var btnOkP=document.getElementById('ok');
          if(btnNovo)btnNovo.onclick=function(){var prox=proximoJogoParaPalpitar();if(prox){estado.jogo=prox;render();closeModal();setTimeout(function(){abrirPalpite()},150)}else toastMsg('Todos os jogos disponíveis já foram palpitados. ✅')};
          if(btnOkP)btnOkP.onclick=closeModal;
        },0);
        return;
      }

      if(name==='mais'){
        openModal('☰ Mais',`<div class="mini"><strong>Central do Bolão</strong><p>Acesse regulamento, ranking, jogos, bolões ativos e dados do participante.</p><div class="mini-actions"><button class="mini-action" id="abrirCopaMais">🏆 Copa</button><button class="mini-action secondary" id="abrirRegulamentoMais">📄 Regulamento</button></div></div><div class="mini"><strong>Participante</strong><p>${esc(estado.usuario.nome||'Participante')}</p><p>Telegram ID: <b>${esc(estado.usuario.idTelegram||'não identificado')}</b></p></div><div class="mini"><strong>Bolão atual</strong><p>${esc((estado.bolaoAtual&&estado.bolaoAtual.nome_bolao)||CONFIG.ID_BOLAO)}</p></div><div class="mini"><strong>Dados</strong><p>Leitura: JSON estático</p><p>API gravação: ${apiUrl()?'configurada':'não configurada'}</p><p>${estado.cacheAtualizadoEm?'Última carga salva: '+esc(estado.cacheAtualizadoEm):'Nenhum cache salvo ainda.'}</p><p>${estado.cacheUsado?'Dados exibidos pelo JSON público/cache local.':'Dados carregados pelo JSON público.'}</p></div>`, '<button class="btn light" id="entrarCodigo">Entrar Código</button><button class="btn primary" id="criarBolao">Criar Bolão</button>');
        const btnEntrarCodigo=document.getElementById('entrarCodigo');
        const btnCriarBolao=document.getElementById('criarBolao');
        const btnCopaMais=document.getElementById('abrirCopaMais');
        const btnRegMais=document.getElementById('abrirRegulamentoMais');
        if(btnEntrarCodigo)btnEntrarCodigo.onclick=abrirEntrarCodigo;
        if(btnCriarBolao)btnCriarBolao.onclick=abrirCriarBolao;
        if(btnCopaMais)btnCopaMais.onclick=function(){screen('copa')};
        if(btnRegMais)btnRegMais.onclick=function(){screen('regulamento')};
        return;
      }
    }

    function tipoBolaoSeguro(b){
      b=b||{};
      const codigo=String(b.codigo_convite||b.codigo||'').trim().toUpperCase();
      let tipo=String(b.tipo||b.tipo_bolao||'').trim().toUpperCase();
      // Bolão com código de convite real nunca deve aparecer como PÚBLICO.
      if(!tipo || (tipo==='PUBLICO' && codigo && codigo!=='PUBLICO')) tipo='PRIVADO';
      return tipo||'PUBLICO';
    }

    function qtdParticipantesSeguro(b){
      b=b||{};
      const vals=[b.participantes,b.total_participantes,b.qtd_participantes,b.inscritos];
      for(let i=0;i<vals.length;i++){
        const n=Number(vals[i]);
        if(isFinite(n)&&n>0)return n;
      }
      // Criador/bolão privado recém-criado: a inscrição do criador já existe, mesmo que o JSON de perfil ainda não tenha sido republicado.
      if(tipoBolaoSeguro(b)==='PRIVADO' || b.souCriador)return 1;
      return 0;
    }

    function qtdJogosSeguro(b){
      b=b||{};
      const vals=[b.jogos,b.total_jogos,b.qtd_jogos];
      for(let i=0;i<vals.length;i++){
        const n=Number(vals[i]);
        if(isFinite(n)&&n>0)return n;
      }
      const id=String(b.id_bolao||'').trim();
      const home=estado.homePorBolao&&id?estado.homePorBolao[id]:null;
      if(home&&home.dados&&Array.isArray(home.dados.jogos)&&home.dados.jogos.length)return home.dados.jogos.length;
      if(home&&Array.isArray(home.jogos)&&home.jogos.length)return home.jogos.length;
      // Bolões privados criados pelo Mini App são cópia do bolão padrão. Enquanto o JSON de perfil não republica, não exibir 0 indevido.
      if(tipoBolaoSeguro(b)==='PRIVADO')return 72;
      return 0;
    }

    function normalizarBolaoRespostaAcao(bolao,codigo){
      if(!bolao||!bolao.id_bolao)return null;
      const b=Object.assign({},bolao);
      b.id_bolao=String(b.id_bolao||'').trim();
      b.nome_bolao=b.nome_bolao||b.nome||b.id_bolao;
      b.nome=b.nome||b.nome_bolao;
      b.status=b.status||'ATIVO';
      b.codigo_convite=String(b.codigo_convite||codigo||'').trim().toUpperCase();
      b.tipo=tipoBolaoSeguro(b);
      b.tipo_bolao=b.tipo;
      b.link_convite=b.link_convite||b.link_convite_oficial||montarLinkConviteLocal(b);
      b.link_convite_oficial=b.link_convite_oficial||b.link_convite;
      b.link_convite_site=b.link_convite_site||montarLinkConviteLocal(b);
      b.participantes=qtdParticipantesSeguro(b);
      b.jogos=qtdJogosSeguro(b);
      return b;
    }

    function upsertBolaoArrayLocal(arr,bolao){
      arr=Array.isArray(arr)?arr.slice():[];
      if(!bolao||!bolao.id_bolao)return arr;
      const id=String(bolao.id_bolao);
      let achou=false;
      arr=arr.map(function(x){
        if(x&&String(x.id_bolao||'')===id){achou=true;return Object.assign({},x,bolao);}
        return x;
      });
      if(!achou)arr.unshift(bolao);
      return arr;
    }

    function inserirBolaoLocalDeAcao(bolao,grupo){
      const b=normalizarBolaoRespostaAcao(bolao,bolao&&bolao.codigo_convite);
      if(!b)return null;
      estado.boloes=upsertBolaoArrayLocal(estado.boloes,b);
      if(String(b.tipo||b.tipo_bolao||'').toUpperCase()==='PUBLICO')estado.boloesPublicos=upsertBolaoArrayLocal(estado.boloesPublicos,b);
      if(grupo==='criado')estado.meusBoloesCriados=upsertBolaoArrayLocal(estado.meusBoloesCriados,Object.assign({},b,{souCriador:true}));
      if(grupo==='participando')estado.boloesParticipando=upsertBolaoArrayLocal(estado.boloesParticipando,b);
      estado.bolaoAtual=b;
      CONFIG.ID_BOLAO=b.id_bolao;
      CONFIG.AUTO_PERFIL=false;
      try{localStorage.setItem('PSS_MBE_BOLAO_ATIVO',String(CONFIG.ID_BOLAO||''));localStorage.setItem('PSS_MBE_BOLAO_ATIVO_ESCOLHIDO','SIM')}catch(e){}
      try{criarHomeLocalParaBolaoNovo(b);}catch(e){console.warn('Home local pós-ação não foi gerado',e);}
      return b;
    }

    async function entrarBolaoPorCodigoRapido(codigo,opcoes){
      opcoes=opcoes||{};
      codigo=String(codigo||'').trim().toUpperCase();
      if(!codigo)return toastMsg('Informe o código do bolão.');
      let btn=opcoes.botao||document.getElementById('confirmarEntrar');
      try{
        if(btn){btn.disabled=true;btn.textContent=opcoes.textoBotao||'Entrando...'}
        const requestId='ENTRAR_'+String(estado.usuario.idTelegram||'')+'_'+codigo+'_'+Date.now();
        const r=await chamarApiAcao('entrarBolaoPorCodigo',{codigo_convite:codigo,telegram_id:estado.usuario.idTelegram,nome:estado.usuario.nome,username:estado.usuario.username,modo_rapido:'1',client_request_id:requestId});
        if(!r||!r.ok)throw new Error((r&&r.erro)||'Não foi possível entrar no bolão.');
        const b=inserirBolaoLocalDeAcao(r.bolao,'participando');
        closeModal();
        toastMsg((r.ja_inscrito?'Você já estava neste bolão: ':'Entrada confirmada: ')+(b?(b.nome_bolao||b.nome||b.id_bolao):codigo));
        if(b&&b.id_bolao){
          setTimeout(function(){selecionarBolao(b.id_bolao)},120);
        }
        try{sessionStorage.setItem('PSS_MBE_CONVITE_OK_'+codigo,'SIM')}catch(e){}
        return b;
      }catch(e){
        const msg=String(e&&e.message?e.message:e);
        const bolaoConhecido=bolaoPorIdEstatico(CONFIG.ID_BOLAO);
        if(/tempo esgotado|timeout/i.test(msg)&&bolaoConhecido&&opcoes.origem==='link'){
          const b=inserirBolaoLocalDeAcao(Object.assign({},bolaoConhecido,{codigo_convite:codigo,tipo:'PRIVADO',tipo_bolao:'PRIVADO'}),'participando');
          closeModal();
          toastMsg('Solicitação enviada. Abrindo o bolão pelo link; a confirmação final será atualizada no JSON.');
          if(b&&b.id_bolao)setTimeout(function(){selecionarBolao(b.id_bolao)},120);
          return b;
        }
        toastMsg(/tempo esgotado|timeout/i.test(msg)?mensagemTimeoutAcao('entrar'):msg);
        if(btn){btn.disabled=false;btn.textContent='Entrar'}
        throw e;
      }
    }

    function chamarApiJsonp(url,params,timeoutMs){
      return new Promise((resolve,reject)=>{
        const cb='PSS_MBE_CB_'+Date.now()+'_'+Math.floor(Math.random()*100000);
        const script=document.createElement('script');
        const qs=new URLSearchParams(Object.assign({},params,{callback:cb}));
        const sep=url.includes('?')?'&':'?';
        let finalUrl=url+sep+qs.toString();
        let timer=setTimeout(()=>{cleanup();reject(new Error('Tempo esgotado ao consultar API.'))},Number(timeoutMs||12000));

        function cleanup(){
          clearTimeout(timer);
          try{delete window[cb]}catch(e){window[cb]=undefined}
          if(script&&script.parentNode)script.parentNode.removeChild(script);
        }

        window[cb]=dados=>{cleanup();resolve(dados)};
        script.onerror=()=>{cleanup();reject(new Error('Falha ao carregar API JSONP.'))};
        script.src=finalUrl;
        document.head.appendChild(script);
      });
    }

    async function loadApi(force,silencioso){
      const url=apiUrl();
      const tinhaCache=!!estado.jogo||estado.jogos.length>0||estado.ranking.length>0||estado.boloes.length>0;
      estado.carregando=!tinhaCache;
      estado.erroApi='';
      render();

      if(!url){
        estado.carregando=false;
        estado.erroApi='API fixa não configurada no index.html.';
        render();
        if(!tinhaCache)toastMsg(estado.erroApi);
        return;
      }

      const paramsBase={
        acao:'obterHomeBolaoEsportivo',
        id_bolao:(CONFIG.AUTO_PERFIL&&estado.usuario.idTelegram)?'':CONFIG.ID_BOLAO,
        auto_perfil:(CONFIG.AUTO_PERFIL&&estado.usuario.idTelegram)?'1':'',
        codigo_convite:CONFIG.CODIGO_CONVITE,
        telegram_id:estado.usuario.idTelegram,
        nome:estado.usuario.nome,
        username:estado.usuario.username,
        v:CONFIG.VERSAO,
        force:force?'1':''
      };

      try{
        let j;
        try{
          j=await chamarApiJsonp(url,paramsBase,14000);
        }catch(e1){
          console.warn('Primeira tentativa da API falhou, tentando novamente.',e1);
          await new Promise(r=>setTimeout(r,650));
          j=await chamarApiJsonp(url,Object.assign({},paramsBase,{force:'1',retry:Date.now()}),26000);
        }
        if(!j||!j.ok)throw new Error((j&&j.erro)||'Resposta inválida da API.');
        const dados=j.dados||{};
        aplicarDadosApi(dados,'api');
        salvarCache(dados);
        estado.carregando=false;
        estado.erroApi='';
        render();
      }catch(e){
        console.warn('API indisponível.',e);
        estado.carregando=false;
        estado.erroApi='API demorou ou falhou: '+e.message;
        render();
        if(!silencioso)toastMsg(tinhaCache?'API demorou/falhou. Mantendo dados já carregados/cache local.':estado.erroApi);
      }
    }

      if(conviteInicialJaTratado_(codigo))return;
      if(usuarioJaInscritoNoBolaoPerfil_(id))return;
      const b=bolaoPorIdEstatico(id)||{id_bolao:id,nome_bolao:id,codigo_convite:codigo,tipo:'PRIVADO',tipo_bolao:'PRIVADO'};
      const nome=b.nome_bolao||b.nome||id;
      const corpo='<div class="mini bolao-contexto"><strong>Entrar neste bolão?</strong><p><b>'+esc(nome)+'</b></p><p>Código de convite: <b>'+esc(codigo)+'</b></p></div><div class="mini"><p>Ao confirmar, seu perfil do Telegram será inscrito neste bolão e os palpites/ranking ficarão separados.</p></div>';
      openModal('🔑 Convite do Bolão',corpo,'<button class="btn light" id="cancelarConviteLink">Cancelar</button><button class="btn primary" id="confirmarConviteLink">Entrar no Bolão</button>');
      const cancelar=document.getElementById('cancelarConviteLink');
      const confirmar=document.getElementById('confirmarConviteLink');
      if(cancelar)cancelar.onclick=function(){try{sessionStorage.setItem('PSS_MBE_CONVITE_OK_'+codigo,'SIM')}catch(e){} closeModal();};
      if(confirmar)confirmar.onclick=function(){entrarBolaoPorCodigoRapido(codigo,{origem:'link',botao:confirmar,textoBotao:'Entrando...'})};
    }

    async function iniciarCarregamentoInstantaneo(){
      // V035: a leitura principal é 100% JSON estático publicado no GitHub/Cloudflare.
      // Apps Script/JSONP fica apenas para ações de gravação: salvar palpite, criar bolão e entrar por código.
      try{
        const jsonOk=await carregarJsonPublicoPerfilEstatico();
        if(jsonOk){setTimeout(abrirConfirmacaoConviteInicial,220);return;}
      }catch(e){
        console.warn('Falha ao carregar JSON estático.',e);
        estado.carregando=false;
        estado.erroApi='JSON público não carregou: '+(e&&e.message?e.message:String(e));
        render();
        toastMsg(estado.erroApi);
        return;
      }
      estado.carregando=false;
      estado.erroApi='JSON público não encontrado para o perfil/bolão.';
      render();
    }

    (function(){initTelegram();limparCachesAntigosSeNecessario();horaAtual();setInterval(horaAtual,30000);setInterval(atualizarTimersVisiveis,1000);carregarCache();events();render();setTimeout(()=>iniciarCarregamentoInstantaneo(),50)})();
  </script>
