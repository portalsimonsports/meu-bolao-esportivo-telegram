  <script>
    const URL_PARAMS=new URLSearchParams(window.location.search||'');
    const API_PARAM=URL_PARAMS.get('api')||'';
    if(API_PARAM){try{localStorage.setItem('PSS_MBE_API_URL',API_PARAM)}catch(e){}}

    const CONFIG={
      VERSAO:'V031D_FIX_BOLOES_PALPITES',
      API_URL:API_PARAM||'', // Recebida automaticamente pelo botão do Telegram: ?api=WEBAPP_URL.
      API_URL_FIXA:'https://script.google.com/macros/s/AKfycbzp2XfmJUtcSrZNZe9Jk45ESlvvRoEMZULSw13J0qgd5ukchetCdppOQ65wrpp2OKw/exec', // API fixa para permitir link limpo no grupo sem parâmetro ?api=.
      ID_BOLAO:URL_PARAMS.get('id_bolao')||localStorage.getItem('PSS_MBE_BOLAO_ATIVO')||'BOLAO001',
      CODIGO_CONVITE:URL_PARAMS.get('codigo_convite')||URL_PARAMS.get('codigo')||'',
      ENVIAR_AO_BOT_SEM_API:true,
      CACHE_TTL_MINUTOS:30,
      CACHE_MAX_HORAS:24,
      TELEGRAM_MINIAPP_OFICIAL:'https://t.me/MeuBolaoEsportivoBot/meubolaoesportivo',
      JSON_PUBLICO_ATIVO:true,
      JSON_PUBLICO_BASE:'data',
      JSON_PUBLICO_TIMEOUT_MS:1800,
      API_REFRESH_SILENCIOSO:true
    };

    const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
    const estado={
      usuario:{idTelegram:'',nome:'Participante',username:''},
      jogo:null,
      ranking:[],
      jogos:[],
      boloes:[],
      boloesPublicos:[],
      meusBoloesCriados:[],
      boloesParticipando:[],
      bolaoAtual:null,
      meusPalpites:{},
      carregando:true,
      erroApi:'',
      palpite:'',
      cacheUsado:false,
      cacheAtualizadoEm:'',
      sincronizandoBoloes:false,
      tentouAtualizarBoloesTelegram:false,
      usuarioAdmin:false
    };

    function initTelegram(){
      if(tg){
        tg.ready();tg.expand();
        try{tg.setHeaderColor('#062d1d');tg.setBackgroundColor('#00170e');tg.enableClosingConfirmation()}catch(e){}
        const u=tg.initDataUnsafe&&tg.initDataUnsafe.user?tg.initDataUnsafe.user:null;
        if(u){
          estado.usuario={idTelegram:String(u.id||''),nome:[u.first_name,u.last_name].filter(Boolean).join(' ')||u.username||'Participante',username:u.username||''};
          try{localStorage.setItem('PSS_MBE_ULTIMO_TELEGRAM_ID',estado.usuario.idTelegram);localStorage.setItem('PSS_MBE_ULTIMO_NOME',estado.usuario.nome);localStorage.setItem('PSS_MBE_ULTIMO_USERNAME',estado.usuario.username||'')}catch(e){}
        }
      }

      // Fallback só para teste no navegador: permite abrir como ?telegram_id=197139159.
      // No uso real, o Telegram envia o id automaticamente via initDataUnsafe.user.
      if(!estado.usuario.idTelegram && URL_PARAMS.get('telegram_id')){
        estado.usuario={idTelegram:String(URL_PARAMS.get('telegram_id')||''),nome:URL_PARAMS.get('nome')||'Participante',username:URL_PARAMS.get('username')||''};
      }

      aplicarStartParamTelegram();
    }

    function aplicarStartParamTelegram(){
      let sp=URL_PARAMS.get('tgWebAppStartParam')||URL_PARAMS.get('startapp')||'';
      try{if(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)sp=tg.initDataUnsafe.start_param||sp}catch(e){}
      sp=String(sp||'').trim();
      if(!sp)return;
      const partes=sp.split('_');
      if(partes[0])CONFIG.ID_BOLAO=partes[0];
      if(partes[1])CONFIG.CODIGO_CONVITE=partes[1].toUpperCase();
    }

    function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
    function apiUrl(){
      const fixa=String(CONFIG.API_URL_FIXA||'').trim();
      const param=String(CONFIG.API_URL||'').trim();
      const salva=String(localStorage.getItem('PSS_MBE_API_URL')||'').trim();
      const candidatos=[param,fixa,salva].filter(Boolean);
      for(const u of candidatos){
        if(/^https:\/\/script\.google\.com\/macros\/s\/[^\/]+\/exec/i.test(u))return u;
      }
      return fixa;
    }
    function isAberto(j){return !!(j&&j.aceitaPalpite)}
    function statusJogo(j){return String(j&&j.status?j.status:(isAberto(j)?'Aberto':'Em breve'))}
    function idJogo(j){return String((j&&(j.id_jogo||j.id))||'')}

    function jogoAtualDaLista(j){
      const id=idJogo(j);
      if(!id)return j;
      return estado.jogos.find(x=>idJogo(x)===id)||j;
    }

    function palpitePodeSerExibido(j){
      const atual=jogoAtualDaLista(j);
      const st=normalizarChave(statusJogo(atual));
      // Enquanto o jogo estiver aberto para palpite, o placar digitado fica oculto.
      // A exibição é liberada somente quando a API indicar que o palpite/jogo já fechou.
      if(isAberto(atual))return false;
      if(['ABERTO','PALPITES ABERTOS','EM BREVE','AGENDADO','AGENDADA','A INICIAR','PROGRAMADO'].indexOf(st)>=0)return false;
      return true;
    }

    function textoPalpitePrivado(p,j){
      if(!p)return '';
      return 'Meu palpite: '+textoPalpiteLocal(p);
    }

    function bolaoNomeAtual(){
      return (estado.bolaoAtual&&(estado.bolaoAtual.nome_bolao||estado.bolaoAtual.nome))||CONFIG.ID_BOLAO||'Bolão atual';
    }

    function bolaoTipoAtual(){
      return (estado.bolaoAtual&&(estado.bolaoAtual.tipo_bolao||estado.bolaoAtual.tipo))||'';
    }

    function htmlBolaoContexto(extra){
      return '<div class="mini bolao-contexto"><strong>🏆 Bolão atual: '+esc(bolaoNomeAtual())+'</strong>'+
        (bolaoTipoAtual()?'<p>'+esc(String(bolaoTipoAtual()).toUpperCase())+'</p>':'')+
        (extra?'<p>'+extra+'</p>':'')+
        '</div>';
    }


    function normalizarChave(v){
      return String(v||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
    }

    function chaveJogoSemHora(j){
      if(!j)return '';
      return [
        normalizarChave(j.id_bolao||CONFIG.ID_BOLAO),
        normalizarChave(j.mandante),
        normalizarChave(j.visitante),
        String(j.data||'').trim()
      ].join('|');
    }

    function scoreDuplicado(j){
      let score=0;
      const hora=String(j&&j.hora||'').trim();
      const limite=String(j&&j.limitePalpite||'').trim();
      if(hora)score+=10;
      if(hora&&hora!=='00:00'&&hora!=='00:00:00')score+=100;
      if(limite&&limite.indexOf('00:00')<0)score+=50;
      if(j&&j.aceitaPalpite)score+=5;
      return score;
    }

    function deduplicarJogos(jogos){
      const mapa={};
      (jogos||[]).forEach(j=>{
        const chave=chaveJogoSemHora(j);
        if(!chave)return;
        if(!mapa[chave]||scoreDuplicado(j)>scoreDuplicado(mapa[chave]))mapa[chave]=j;
      });
      return Object.values(mapa).sort((a,b)=>String((a.data||'')+' '+(a.hora||'')).localeCompare(String((b.data||'')+' '+(b.hora||''))));
    }


    function normalizarTextoPais(v){
      return String(v||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
    }

    function codigoPais(nome){
      const mapa={
        'MEXICO':'mx','SOUTH AFRICA':'za','AFRICA DO SUL':'za','KOREA REPUBLIC':'kr','COREIA DO SUL':'kr','CZECH REPUBLIC':'cz','REPUBLICA TCHECA':'cz','CANADA':'ca','BOSNIA AND HERZEGOVINA':'ba','BOSNIA E HERZEGOVINA':'ba','UNITED STATES':'us','USA':'us','ESTADOS UNIDOS':'us','PARAGUAY':'py','PARAGUAI':'py','QATAR':'qa','SWITZERLAND':'ch','SUICA':'ch','BRAZIL':'br','BRASIL':'br','MOROCCO':'ma','MARROCOS':'ma','HAITI':'ht','SCOTLAND':'gb-sct','ESCOCIA':'gb-sct','TURKIYE':'tr','TÜRKIYE':'tr','TURKEY':'tr','TURQUIA':'tr','GERMANY':'de','ALEMANHA':'de','CURACAO':'cw','CURAÇÃO':'cw','NETHERLANDS':'nl','HOLANDA':'nl','PAISES BAIXOS':'nl','JAPAN':'jp','JAPAO':'jp','COTE DIVOIRE':'ci',"COTE D'IVOIRE":'ci',"CÔTE D'IVOIRE":'ci','COSTA DO MARFIM':'ci','ECUADOR':'ec','SWEDEN':'se','SUECIA':'se','TUNISIA':'tn','TUNISIA':'tn','SPAIN':'es','ESPANHA':'es','CAPE VERDE ISLANDS':'cv','CABO VERDE':'cv','BELGIUM':'be','BELGICA':'be','EGYPT':'eg','EGITO':'eg','SAUDI ARABIA':'sa','ARABIA SAUDITA':'sa','URUGUAY':'uy','URUGUAI':'uy','IRAN':'ir','NEW ZEALAND':'nz','NOVA ZELANDIA':'nz','FRANCE':'fr','FRANCA':'fr','SENEGAL':'sn','IRAQ':'iq','NORWAY':'no','NORUEGA':'no','ARGENTINA':'ar','ALGERIA':'dz','ARGELIA':'dz','AUSTRIA':'at','JORDAN':'jo','JORDANIA':'jo','PORTUGAL':'pt','CONGO DR':'cd','DR CONGO':'cd','REPUBLICA DEMOCRATICA DO CONGO':'cd','ENGLAND':'gb-eng','INGLATERRA':'gb-eng','CROATIA':'hr','CROACIA':'hr','GHANA':'gh','PANAMA':'pa','UZBEKISTAN':'uz','COLOMBIA':'co'
      };
      return mapa[normalizarTextoPais(nome)]||'';
    }

    function flagUrl(codigo){
      codigo=String(codigo||'').trim().toLowerCase();
      return codigo?`https://flagcdn.com/${codigo}.svg`:'';
    }

    function renderFlag(el,codigo,emoji,nome){
      const code=String(codigo||codigoPais(nome)||'').trim().toLowerCase();
      el.className='flag';
      el.innerHTML='';
      if(code){
        const img=document.createElement('img');
        img.className='flag-img';
        img.alt='Bandeira de '+(nome||'time');
        img.src=flagUrl(code);
        img.onerror=function(){el.innerHTML='';el.textContent=emoji||'⚽'};
        el.appendChild(img);
      }else{
        el.textContent=emoji||'⚽';
      }
      el.setAttribute('aria-label','Bandeira/ícone de '+(nome||'time'));
    }

    function flagHtml(j,lado){
      const nome=lado==='mandante'?j.mandante:j.visitante;
      const code=lado==='mandante'?(j.codigoMandante||codigoPais(nome)):(j.codigoVisitante||codigoPais(nome));
      const emoji=lado==='mandante'?(j.flagMandante||'⚽'):(j.flagVisitante||'⚽');
      return code?`<img class="inline-flag" src="${flagUrl(code)}" alt="${esc(nome)}">`:esc(emoji);
    }

    function normalizarJogo(j){
      if(!j)return null;
      return {
        id:j.id||j.id_jogo||'',
        id_bolao:j.id_bolao||CONFIG.ID_BOLAO,
        id_jogo:j.id_jogo||j.id||'',
        mandante:j.mandante||j.a||'MANDANTE',
        visitante:j.visitante||j.b||'VISITANTE',
        flagMandante:j.flagMandante||j.flag_mandante||j.flagMandanteEmoji||'⚽',
        flagVisitante:j.flagVisitante||j.flag_visitante||j.flagVisitanteEmoji||'⚽',
        codigoMandante:j.codigoMandante||j.codigo_mandante||codigoPais(j.mandante||j.a),
        codigoVisitante:j.codigoVisitante||j.codigo_visitante||codigoPais(j.visitante||j.b),
        data:j.data||'',
        hora:j.hora||'',
        dataHora:j.dataHora||'',
        limitePalpite:j.limitePalpite||'',
        status:j.status||'Em breve',
        aceitaPalpite:j.aceitaPalpite===true||String(j.aceitaPalpite).toUpperCase()==='SIM',
        meuPalpite:normalizarPalpiteApi(j.meuPalpite)
      };
    }



    function jsonPublicoHomeUrl(){
      const id=String(CONFIG.ID_BOLAO||'BOLAO001').trim()||'BOLAO001';
      const base=String(CONFIG.JSON_PUBLICO_BASE||'data').replace(/^\/+|\/+$/g,'')||'data';
      const url=new URL(base+'/home_'+encodeURIComponent(id)+'.json',window.location.href);
      url.searchParams.set('v',CONFIG.VERSAO||'');
      return url.toString();
    }

    async function fetchJsonComTimeout(url,timeoutMs){
      const controller=window.AbortController?new AbortController():null;
      const timer=setTimeout(()=>{try{if(controller)controller.abort()}catch(e){}},Number(timeoutMs||1800));
      try{
        const resp=await fetch(url,{cache:'force-cache',signal:controller?controller.signal:undefined});
        if(!resp.ok)throw new Error('HTTP '+resp.status);
        return await resp.json();
      }finally{clearTimeout(timer)}
    }

    async function carregarJsonPublicoEstatico(){
      if(!CONFIG.JSON_PUBLICO_ATIVO)return false;
      try{
        const pacote=await fetchJsonComTimeout(jsonPublicoHomeUrl(),CONFIG.JSON_PUBLICO_TIMEOUT_MS||1800);
        const dados=(pacote&&pacote.dados)?pacote.dados:pacote;
        if(!dados||!Array.isArray(dados.jogos)||!dados.jogos.length)throw new Error('JSON público sem jogos.');
        aplicarDadosApi(dados,'json_publico');
        salvarCache(dados);
        estado.carregando=false;
        estado.erroApi='';
        render();
        return true;
      }catch(e){
        console.warn('JSON público ainda não disponível; usando cache/API.',e);
        return false;
      }
    }

    function cacheKey(){
      return 'PSS_MBE_HOME_CACHE_V031C_'+String(CONFIG.ID_BOLAO||'BOLAO001')+'_'+String(estado.usuario.idTelegram||'ANON');
    }

    function cacheInfoKey(){
      return 'PSS_MBE_HOME_CACHE_INFO_V031C_'+String(CONFIG.ID_BOLAO||'BOLAO001')+'_'+String(estado.usuario.idTelegram||'ANON');
    }

    function chavesCachePossiveis(){
      const id=String(CONFIG.ID_BOLAO||'BOLAO001');
      const tg=String(estado.usuario.idTelegram||'ANON');
      // V031: não usar caches antigos/estáveis porque eles podem conter lista cortada em 45 jogos.
      return [
        'PSS_MBE_HOME_CACHE_V031C_'+id+'_'+tg
      ];
    }

    function limparCachesAntigosSeNecessario(){
      try{
        const apiSalva=String(localStorage.getItem('PSS_MBE_API_URL')||'');
        if(apiSalva && !/^https:\/\/script\.google\.com\/macros\/s\/[^\/]+\/exec/i.test(apiSalva))localStorage.removeItem('PSS_MBE_API_URL');

        // V031: limpa somente caches de HOME antigos que podiam trazer 45 jogos.
        // Não remove palpites locais nem dados reais da aba PALPITES.
        const limpar=String(URL_PARAMS.get('limpar_cache')||'').toLowerCase();
        const deveLimpar=limpar==='1'||limpar==='sim'||limpar==='true';
        const removiveis=[];
        for(let i=0;i<localStorage.length;i++){
          const k=localStorage.key(i)||'';
          if(k.startsWith('PSS_MBE_HOME_CACHE_')||k.startsWith('PSS_MBE_HOME_CACHE_INFO_')){
            if(deveLimpar || !k.includes('_V031C_'))removiveis.push(k);
          }
        }
        removiveis.forEach(k=>localStorage.removeItem(k));
      }catch(e){}
    }

    function aplicarDadosApi(dados, origem) {
  dados = dados || {};
  if (dados.id_bolao) {
    CONFIG.ID_BOLAO = dados.id_bolao;
    // CORRECAO: persiste o bolão ativo para sobreviver a recarregamentos.
    try { localStorage.setItem('PSS_MBE_BOLAO_ATIVO', dados.id_bolao); } catch(e) {}
  }
  estado.bolaoAtual = dados.bolaoAtual || null;
  estado.jogos = deduplicarJogos(Array.isArray(dados.jogos) ? dados.jogos.map(normalizarJogo).filter(Boolean) : []);
  estado.ranking = Array.isArray(dados.ranking) ? dados.ranking.map(normalizarRankingItem) : [];
  estado.boloes = Array.isArray(dados.boloes) ? dados.boloes : [];
  estado.boloesPublicos = Array.isArray(dados.boloesPublicos) ? dados.boloesPublicos : estado.boloes.filter(b => String(b.tipo || 'PUBLICO').toUpperCase() === 'PUBLICO');
  estado.meusBoloesCriados = Array.isArray(dados.meusBoloesCriados) ? dados.meusBoloesCriados : estado.boloes.filter(b => b.souCriador);
  estado.boloesParticipando = Array.isArray(dados.boloesParticipando) ? dados.boloesParticipando : [];
  estado.usuarioAdmin = (dados.usuarioAdmin === true || String(dados.usuarioAdmin || '').toUpperCase() === 'SIM');

  // CORRECAO A: Nunca zera palpites locais ao receber dados da API.
  const palpitesLocaisAtual = carregarPalpitesLocais();
  const novosMeusPalpites = {};

  // Índice dos jogos atualmente carregados (para validar palpites locais)
  const idsJogosAtuais = {};
  estado.jogos.forEach(function(j) { idsJogosAtuais[String(j.id_jogo || j.id || '')] = true; });

  // 1) Palpites locais do bolão ativo: sem filtro de versão, apenas id_bolao + id_jogo + usuario
  Object.keys(palpitesLocaisAtual).forEach(function(k) {
    const p = palpitesLocaisAtual[k];
    if (!p) return;
    if (String(p.id_bolao || '') !== String(CONFIG.ID_BOLAO || '')) return;
    if (!idsJogosAtuais[String(p.id_jogo || '')]) return;
    const uidAtual = String(estado.usuario.idTelegram || '');
    const uidPalpite = String((p.usuario && p.usuario.idTelegram) || p.telegram_id || '');
    if (uidAtual && uidPalpite && uidAtual !== uidPalpite) return;
    // CORRECAO B: REMOVE o filtro de versão que descartava palpites válidos.
    // if (p.versao && String(p.versao) !== String(CONFIG.VERSAO)) return; // <-- REMOVIDO
    const normal = normalizarPalpiteApi({
      id_bolao: p.id_bolao,
      id_jogo: p.id_jogo,
      placarMandante: p.palpite && p.palpite.placarMandante,
      placarVisitante: p.palpite && p.palpite.placarVisitante,
      dataHora: p.dataHora,
      status: 'VALIDO'
    });
    if (normal && normal.id_jogo) novosMeusPalpites[k] = normal;
  });

  // 2) Mescla palpites vindos da API sem sobrescrever os locais (local tem prioridade)
  if (Array.isArray(dados.meusPalpites)) {
    dados.meusPalpites.forEach(function(p) {
      const normal = normalizarPalpiteApi(p);
      if (!normal || !normal.id_jogo) return;
      const k = String(normal.id_bolao || CONFIG.ID_BOLAO) + '|' + String(normal.id_jogo);
      if (!novosMeusPalpites[k]) novosMeusPalpites[k] = normal;
    });
  }

  // 3) Palpites embutidos em cada jogo (vindos do campo meuPalpite do jogo)
  estado.jogos.forEach(function(j) {
    if (j.meuPalpite && j.meuPalpite.id_jogo) {
      const k = String(j.id_bolao || CONFIG.ID_BOLAO) + '|' + String(j.id_jogo || j.id);
      if (!novosMeusPalpites[k]) novosMeusPalpites[k] = j.meuPalpite;
    }
  });

  estado.meusPalpites = novosMeusPalpites;
  salvarMeusPalpitesApiNoLocal();

  estado.jogo = jogoDestaqueHome();
  estado.cacheUsado = origem === 'cache';
  estado.cacheAtualizadoEm = dados.cacheAtualizadoEm || dados.dataCache || estado.cacheAtualizadoEm || '';
}


    function normalizarRankingItem(r){
      r=r||{};
      // CORRECAO: so exibe ranking se ha palpites processados (total_pontos vindo da API)
      // Evita exibir pontuacao falsa antes de qualquer jogo ter sido computado.
      var pontos=(r.total_pontos!==undefined&&r.total_pontos!==null&&r.total_pontos!=='')?Number(r.total_pontos):Number(r.pontos||0);
      if(Number.isNaN(pontos))pontos=0;
      return Object.assign({},r,{pontos:pontos,total_pontos:pontos});
    }

    function normalizarPalpiteApi(p){
      if(!p)return null;
      const idb=String(p.id_bolao||CONFIG.ID_BOLAO||'');
      const idj=String(p.id_jogo||p.id||'');
      if(!idj)return null;
      const pm=p.placarMandante!==undefined?p.placarMandante:p.palpite_mandante;
      const pv=p.placarVisitante!==undefined?p.placarVisitante:p.palpite_visitante;
      return {
        id_bolao:idb,
        id_jogo:idj,
        jogo:p.jogo||null,
        palpite:{placarMandante:pm,placarVisitante:pv},
        dataHora:p.dataHora||p.data_hora||'',
        status:p.status||'VALIDO',
        pontos:p.pontos||''
      };
    }

    function salvarMeusPalpitesApiNoLocal(){
      try{
        const mapa=carregarPalpitesLocais();
        Object.keys(estado.meusPalpites||{}).forEach(k=>{
          const p=estado.meusPalpites[k];
          const jogo=estado.jogos.find(j=>String(j.id_jogo||j.id)===String(p.id_jogo));
          mapa[k]={tipo:'PALPITE_BOLAO_ESPORTIVO',versao:CONFIG.VERSAO,dataHora:p.dataHora||new Date().toISOString(),id_bolao:p.id_bolao,id_jogo:p.id_jogo,usuario:estado.usuario,jogo:jogo||p.jogo||{},palpite:p.palpite};
        });
        localStorage.setItem(palpitesKey(),JSON.stringify(mapa));
      }catch(e){}

    function salvarCache(dados){
      try{
        if(!dados)return;
        const pacote={salvoEm:Date.now(),versao:CONFIG.VERSAO,id_bolao:CONFIG.ID_BOLAO,dados:dados||{}};
        pacote.dados.cacheAtualizadoEm=new Date(pacote.salvoEm).toLocaleString('pt-BR');
        localStorage.setItem(cacheKey(),JSON.stringify(pacote));
        localStorage.setItem(cacheInfoKey(),JSON.stringify({salvoEm:pacote.salvoEm,versao:CONFIG.VERSAO}));
        estado.cacheAtualizadoEm=pacote.dados.cacheAtualizadoEm;
      }catch(e){console.warn('Não foi possível salvar cache local.',e)}
    }

    function carregarCache(){
      try{
        const keys=chavesCachePossiveis();
        for(const key of keys){
          const raw=localStorage.getItem(key);
          if(!raw)continue;
          const pacote=JSON.parse(raw);
          if(!pacote||!pacote.dados||!pacote.salvoEm)continue;
          const idadeHoras=(Date.now()-Number(pacote.salvoEm||0))/(60*60*1000);
          if(idadeHoras>Number(CONFIG.CACHE_MAX_HORAS||24))continue;
          pacote.dados.cacheAtualizadoEm=new Date(Number(pacote.salvoEm)).toLocaleString('pt-BR');
          aplicarDadosApi(pacote.dados,'cache');
          estado.carregando=false;
          estado.erroApi='';
          return true;
        }
      }catch(e){console.warn('Cache local inválido.',e)}
      return false;
    }

    function cacheRecente(){
      try{
        const raw=localStorage.getItem(cacheInfoKey());
        if(!raw)return false;
        const info=JSON.parse(raw);
        const idadeMin=(Date.now()-Number(info.salvoEm||0))/(60*1000);
        return idadeMin>=0&&idadeMin<Number(CONFIG.CACHE_TTL_MINUTOS||30);
      }catch(e){return false}
    }

    function palpitesKey() {
  // CORRECAO: chave fixa por usuário, não por bolão.
  // Assim palpites de todos os bolões ficam no mesmo mapa e não somem ao trocar de bolão.
  return 'PSS_MBE_PALPITES_' + String(estado.usuario.idTelegram || 'LOCAL');
}

    function palpiteKeyJogo(j){
      return String((j&&j.id_bolao)||CONFIG.ID_BOLAO||'BOLAO001')+'|'+String(idJogo(j));
    }

    function palpiteLocalValidoParaJogo(p,j){
      if(!p||!j)return false;
      if(String(p.id_bolao||'')!==String((j&&j.id_bolao)||CONFIG.ID_BOLAO||''))return false;
      if(String(p.id_jogo||'')!==String(idJogo(j)))return false;
      const uidAtual=String(estado.usuario.idTelegram||'');
      const uidPalpite=String((p.usuario&&p.usuario.idTelegram)||p.telegram_id||'');
      if(uidAtual && uidPalpite && uidAtual!==uidPalpite)return false;
      // V031: localStorage antigo de versões anteriores não entra no contador para evitar falso “já palpitado”.
      if(p.versao && String(p.versao)!==String(CONFIG.VERSAO))return false;
      const pal=p.palpite||{};
      return pal.placarMandante!==undefined && pal.placarVisitante!==undefined;
    }

    function carregarPalpitesLocais() {
  try {
    // Tenta a chave nova (sem id_bolao)
    const raw = localStorage.getItem(palpitesKey());
    if (raw) {
      const mapa = JSON.parse(raw);
      if (mapa && typeof mapa === 'object') return mapa;
    }
    // Fallback: tenta chave antiga (com id_bolao) para não perder palpites já salvos
    const rawLegado = localStorage.getItem(
      'PSS_MBE_PALPITES_' + String(CONFIG.ID_BOLAO || 'BOLAO001') + '_' + String(estado.usuario.idTelegram || 'LOCAL')
    );
    if (rawLegado) {
      const mapaLegado = JSON.parse(rawLegado);
      if (mapaLegado && typeof mapaLegado === 'object') {
        // Migra para chave nova e remove a antiga
        try {
          localStorage.setItem(palpitesKey(), rawLegado);
          localStorage.removeItem(
            'PSS_MBE_PALPITES_' + String(CONFIG.ID_BOLAO || 'BOLAO001') + '_' + String(estado.usuario.idTelegram || 'LOCAL')
          );
        } catch(eMig) {}
        return mapaLegado;
      }
    }
  } catch(e) {
    console.warn('Cache de palpites inválido.', e);
  }
  return {};
}

    function getPalpiteLocal(j){
      if(!j)return null;
      const key=palpiteKeyJogo(j);
      if(estado.meusPalpites&&estado.meusPalpites[key]){
        const p=estado.meusPalpites[key];
        return {tipo:'PALPITE_BOLAO_ESPORTIVO',versao:CONFIG.VERSAO,dataHora:p.dataHora||'',id_bolao:p.id_bolao,id_jogo:p.id_jogo,usuario:estado.usuario,jogo:j,palpite:p.palpite};
      }
      if(j.meuPalpite){
        const p=normalizarPalpiteApi(j.meuPalpite);
        if(p)return {tipo:'PALPITE_BOLAO_ESPORTIVO',versao:CONFIG.VERSAO,dataHora:p.dataHora||'',id_bolao:p.id_bolao,id_jogo:p.id_jogo,usuario:estado.usuario,jogo:j,palpite:p.palpite};
      }
      const mapa=carregarPalpitesLocais();
      const local=mapa[key]||null;
      return palpiteLocalValidoParaJogo(local,j)?local:null;
    }

    function salvarPalpiteLocal(payload) {
  try {
    const mapa = carregarPalpitesLocais();
    // CORRECAO: chave sempre inclui id_bolao para diferenciar palpites entre bolões
    // mesmo que palpitesKey() agora seja compartilhada por bolão.
    const key = String(payload.id_bolao || CONFIG.ID_BOLAO) + '|' + String(payload.id_jogo || '');
    mapa[key] = payload;
    estado.meusPalpites[key] = normalizarPalpiteApi({
      id_bolao: payload.id_bolao,
      id_jogo: payload.id_jogo,
      placarMandante: payload.palpite.placarMandante,
      placarVisitante: payload.palpite.placarVisitante,
      dataHora: payload.dataHora,
      status: 'VALIDO'
    });
    localStorage.setItem(palpitesKey(), JSON.stringify(mapa));
    localStorage.setItem('ultimo_palpite_bolao_esportivo', JSON.stringify(payload));
  } catch(e) {
    console.warn('Não foi possível salvar palpite local.', e);
  }
}

    function textoPalpiteLocal(p){

    function parseDataHoraJogo(j){
      if(!j)return null;
      const base=String((j.limitePalpite&&j.limitePalpite!=='')?j.limitePalpite:((j.data||'')+' '+(j.hora||''))).trim();
      let m=base.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s*(?:às)?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?)?/i);
      if(m){
        const d=new Date(Number(m[3]),Number(m[2])-1,Number(m[1]),Number(m[4]||0),Number(m[5]||0),Number(m[6]||0));
        return Number.isNaN(d.getTime())?null:d;
      }
      const d=new Date(base);
      return Number.isNaN(d.getTime())?null:d;
    }

    function textoTempoRestante(j){
      const alvo=parseDataHoraJogo(j);
      if(!alvo)return '';
      let ms=alvo.getTime()-Date.now();
      if(ms<=0)return 'encerrado';
      let total=Math.floor(ms/1000);
      const d=Math.floor(total/86400);total-=d*86400;
      const h=Math.floor(total/3600);total-=h*3600;
      const m=Math.floor(total/60);const s=total-(m*60);
      const hh=String(h).padStart(2,'0'), mm=String(m).padStart(2,'0'), ss=String(s).padStart(2,'0');
      return d>0?`${d}d ${hh}h ${mm}m ${ss}s`:`${hh}h ${mm}m ${ss}s`;
    }

    function textoDataHoraStatus(j){
      const data=esc(j&&j.data?j.data:'--/--/----');
      const horaJ=esc(j&&j.hora?j.hora:'--:--');
      return `📅 ${data} às ${horaJ} • <span class="chip">${esc(statusJogo(j))}</span>`;
    }

    function htmlTempoParaPalpitar(j){
      if(!isAberto(j))return '';
      const t=textoTempoRestante(j);
      return t?`<p class="countdown">⏳ Tempo para palpitar: <b data-countdown-jogo="${esc(idJogo(j))}">${esc(t)}</b></p>`:'';
    }

    function proximoJogoParaPalpitar(jAtual){
      const abertos=estado.jogos.filter(j=>isAberto(j)&&!getPalpiteLocal(j));
      if(!abertos.length)return null;
      const atualId=idJogo(jAtual||estado.jogo);
      if(!atualId)return abertos[0];
      const idx=estado.jogos.findIndex(j=>idJogo(j)===atualId);
      for(let i=idx+1;i<estado.jogos.length;i++){
        const j=estado.jogos[i];
        if(isAberto(j)&&!getPalpiteLocal(j))return j;
      }
      return abertos[0];
    }

    function millisJogo(j){
      if(!j)return Infinity;
      var d=parseDataHoraJogo(j);
      return d?d.getTime():Infinity;
    }
    function jogoDestaqueHome(){
      // CORRECAO: exibe o proximo jogo a ocorrer em ordem cronologica.
      // Se todos finalizados/cancelados, exibe o primeiro da lista.
      var lista=(estado.jogos||[]).slice().sort(function(a,b){return millisJogo(a)-millisJogo(b)});
      var agora=Date.now();
      // Prioridade 1: jogo aberto (mais proximo do inicio)
      for(var i=0;i<lista.length;i++){
        var j=lista[i];
        if(isAberto(j))return j;
      }
      // Prioridade 2: proximo jogo futuro que ainda nao encerrou
      for(var i=0;i<lista.length;i++){
        var j=lista[i];
        var st=statusJogo(j).toUpperCase();
        if(st!=='FINALIZADO'&&st!=='CANCELADO'){
          var ms=millisJogo(j);
          if(ms===Infinity||ms>agora)return j;
        }
      }
      // Prioridade 3: o mais proximo do inicio mesmo que passado
      for(var i=0;i<lista.length;i++){
        var j=lista[i];
        var st=statusJogo(j).toUpperCase();
        if(st!=='FINALIZADO'&&st!=='CANCELADO')return j;
      }
      return lista[0]||null;
    }

        enviado=true;
        const jogoSalvo=estado.jogo;
        const ok=await confirmarPalpite(true);
        if(ok){
          setStatus('✅ Palpite salvo automaticamente. Carregando próximo jogo disponível...','ok');
          const prox=proximoJogoParaPalpitar(jogoSalvo);
          setTimeout(()=>{
            if(prox){
              estado.jogo=prox;
              render();
              closeModal();
              setTimeout(()=>abrirPalpite(),180);
            }else{
              closeModal();
              toastMsg('✅ Todos os jogos disponíveis já foram palpitados.');
            }
          },850);
        }else{
          enviado=false;
          setStatus('Não foi possível salvar. Confira o placar e tente novamente.','err');
        }
      }
    }

    async function confirmarPalpite(auto){
      const j=estado.jogo;
      const a=String(golsA.value||'').trim(),b=String(golsB.value||'').trim();
      if(!j||!isAberto(j)){toastMsg('Este jogo não está aberto para palpite.');return false}
      if(a===''||b===''){toastMsg('Informe o placar palpitado completo.');return false}

      const gm=Number(a),gv=Number(b);
      if(Number.isNaN(gm)||Number.isNaN(gv)||gm<0||gv<0||gm>30||gv>30){toastMsg('Informe um placar válido entre 0 e 30.');return false}

      const payload={
        tipo:'PALPITE_BOLAO_ESPORTIVO',
        versao:CONFIG.VERSAO,
        dataHora:new Date().toISOString(),
        id_bolao:j.id_bolao||CONFIG.ID_BOLAO,
        id_jogo:j.id_jogo||j.id,
        usuario:estado.usuario,
        jogo:j,
        palpite:{resultado:resultadoPorPlacar(gm,gv),placarMandante:gm,placarVisitante:gv}
      };

      try{
        salvarPalpiteLocal(payload);
        render();
        const destino=await enviar(payload);
        toastMsg(destino==='API'?'✅ Palpite salvo neste bolão.':(destino==='BOT'?'✅ Palpite enviado ao bot.':'Palpite salvo neste aparelho.'));
        success();
        return true;
      }catch(e){console.error(e);toastMsg('Não foi possível registrar agora. Abra pelo Telegram e tente novamente.');return false}
    }

    async function enviar(payload){
      // V028: grava primeiro pela API JSONP, sempre usando id_bolao + id_jogo + telegram_id.
      // Isso impede que um palpite de um bolão seja reaproveitado indevidamente em outro.
      try{
        const r=await chamarApiAcao('salvarPalpiteMiniApp',{
          id_bolao:payload.id_bolao,
          id_jogo:payload.id_jogo,
          telegram_id:estado.usuario.idTelegram,
          nome:estado.usuario.nome,
          username:estado.usuario.username,
          placar_mandante:payload.palpite.placarMandante,
          placar_visitante:payload.palpite.placarVisitante
        });
        if(r&&r.ok)return 'API';
        throw new Error((r&&r.mensagem)||(r&&r.erro)||'API não confirmou o palpite.');
      }catch(e){
        console.warn('Falha ao gravar palpite pela API, tentando fallback Telegram.',e);
        if(tg&&CONFIG.ENVIAR_AO_BOT_SEM_API&&typeof tg.sendData==='function'){
          tg.sendData(JSON.stringify(payload));
          return 'BOT';
        }
        throw e;
      }
    }

    function montarLinkConviteLocal(b){
      // Link correto para compartilhar com participantes no Telegram.
      // O Mini App recebe esse valor em tgWebAppStartParam/start_param.
      const id=String((b&&b.id_bolao)||CONFIG.ID_BOLAO||'BOLAO001').trim();
      const codigo=String((b&&b.codigo_convite)||'').trim().toUpperCase();
      const start=[id,codigo].filter(Boolean).join('_').replace(/[^0-9A-Za-z_-]/g,'');
      return CONFIG.TELEGRAM_MINIAPP_OFICIAL+(start?'?startapp='+encodeURIComponent(start):'');
    }

    function montarLinkConviteSiteFallback(b){
      const base=location.origin+location.pathname;
      const params=new URLSearchParams();
      params.set('id_bolao',(b&&b.id_bolao)||CONFIG.ID_BOLAO);
      if(b&&b.codigo_convite)params.set('codigo_convite',b.codigo_convite);
      return base+'?'+params.toString();
    }

    async function criarBolaoPrivado(){
      const nome=String(nomeBolaoNovo.value||'').trim();
      if(!nome)return toastMsg('Informe o nome do bolão.');
      try{
        confirmarCriar.disabled=true;confirmarCriar.textContent='Criando...';
        const r=await chamarApiAcao('criarBolaoPrivado',{nome_bolao:nome,telegram_id:estado.usuario.idTelegram,nome_usuario:estado.usuario.nome,username:estado.usuario.username,campeonato_id:'CUP'});
        if(!r||!r.ok)throw new Error((r&&r.erro)||'Falha ao criar bolão.');
        CONFIG.ID_BOLAO=r.bolao.id_bolao;
        // CORRECAO: mostrar convite imediatamente (antes de recarregar a API para nao sumir)
        mostrarConviteBolao(r.bolao,r.convite);
        // Atualiza lista em segundo plano sem fechar o modal do convite
        setTimeout(function(){loadApi(true)},300);
      }catch(e){toastMsg(e.message||String(e));if(confirmarCriar){confirmarCriar.disabled=false;confirmarCriar.textContent='Criar Bolão'}}
    }

    function abrirEntrarCodigo(){
      if(!estado.usuario.idTelegram)return toastMsg('Abra pelo Telegram para entrar em bolões privados.');
      openModal('🔑 Entrar com Código',`<div class="mini"><strong>Código do convite</strong><p>Digite o código recebido pelo organizador do bolão.</p></div><div class="field"><label>Código</label><input id="codigoBolao" type="text" maxlength="12" placeholder="Ex: ABC123" style="text-transform:uppercase"></div>`, '<button class="btn light" id="cancelarEntrar">Cancelar</button><button class="btn primary" id="confirmarEntrar">Entrar</button>');
      cancelarEntrar.onclick=closeModal;
      confirmarEntrar.onclick=entrarBolaoCodigo;
    }

    async function entrarBolaoCodigo(){
      const codigo=String(codigoBolao.value||'').trim().toUpperCase();
      if(!codigo)return toastMsg('Informe o código do bolão.');
      try{
        confirmarEntrar.disabled=true;confirmarEntrar.textContent='Entrando...';
        const r=await chamarApiAcao('entrarBolaoPorCodigo',{codigo_convite:codigo,telegram_id:estado.usuario.idTelegram,nome:estado.usuario.nome,username:estado.usuario.username});
        if(!r||!r.ok)throw new Error((r&&r.erro)||'Não foi possível entrar no bolão.');
        CONFIG.ID_BOLAO=r.bolao.id_bolao;
        closeModal();
        await loadApi(true);
        toastMsg('Entrada confirmada no bolão: '+(r.bolao.nome_bolao||r.bolao.nome||CONFIG.ID_BOLAO));
      }catch(e){toastMsg(e.message||String(e));if(confirmarEntrar){confirmarEntrar.disabled=false;confirmarEntrar.textContent='Entrar'}}
    }

    function mostrarConviteBolao(bolao,convite){
      var link=(convite&&convite.link)||montarLinkConviteLocal(bolao)||'';
      var codigo=(convite&&convite.codigo)||bolao.codigo_convite||'';
      var nomeB=bolao.nome_bolao||bolao.nome||'Bolão privado';
      // CORRECAO: exibe link de forma clara e instrucoes de compartilhamento
      var corpo='<div class="mini" style="border-color:rgba(10,90,53,.4);background:#f0fff4">'+
        '<strong>✅ '+esc(nomeB)+'</strong>'+
        (codigo&&codigo!=='PUBLICO'?'<p>Código de convite: <b>'+esc(codigo)+'</b></p>':'')+
        (link?'<p style="word-break:break-all;font-size:12px;color:#52635a">'+esc(link)+'</p>':'')+
        '</div>'+
        '<div class="mini"><strong>📤 Compartilhe com os participantes</strong>'+
        '<p>Quem abrir o link pelo Telegram já entra automaticamente no bolão com o código de acesso. Você pode compartilhar a qualquer momento pela tela de Bolões.</p></div>';
      openModal('✅ Bolão Criado',corpo,'<button class="btn light" id="copiarConvite">📋 Copiar link</button><button class="btn light" id="compartilharConviteBtn">📤 Compartilhar</button><button class="btn primary" id="ok">Ver bolões</button>');
      var btnCopiar=document.getElementById('copiarConvite');
      var btnCompartilhar=document.getElementById('compartilharConviteBtn');
      var btnOk=document.getElementById('ok');
      if(btnCopiar)btnCopiar.onclick=function(){copiarTexto(link||codigo)};
      if(btnCompartilhar)btnCompartilhar.onclick=function(){compartilharConvite(link||codigo,nomeB)};
      if(btnOk)btnOk.onclick=function(){closeModal();setTimeout(function(){screen('boloes')},120)};
    }

    async function copiarTexto(txt){
      try{await navigator.clipboard.writeText(txt);toastMsg('Convite copiado.')}catch(e){toastMsg('Copie manualmente: '+txt)}
    }

    function limparCacheAtual(){
      try{localStorage.removeItem(cacheKey());localStorage.removeItem(cacheInfoKey())}catch(e){}
    }

    async function chamarApiAcao(acao,params){
      const url=apiUrl();
      if(!url)throw new Error('API não configurada no Mini App.');
      return await chamarApiJsonp(url,Object.assign({acao:acao,v:CONFIG.VERSAO,t:Date.now()},params||{}),30000);
    }

    function marcarNavAtiva(nav){
      document.querySelectorAll('[data-nav]').forEach(x=>x.classList.remove('active'));
      const alvo=document.querySelector(`[data-nav="${nav}"]`);
      if(alvo)alvo.classList.add('active');
    }

    function voltarInicio(){
      marcarNavAtiva('inicio');
      closeModal();
      try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){window.scrollTo(0,0)}
    }

    function events(){
      btnPalpite.onclick=()=>{estado.jogo=jogoDestaqueHome();abrirPalpite()};
      const btnCloseModal=document.getElementById('btnCloseModal');
      if(btnCloseModal)btnCloseModal.onclick=(e)=>{e.preventDefault();e.stopPropagation();closeModal()};
      modal.onclick=e=>{if(e.target.id==='modal')closeModal()};

      // Botões superiores e links internos com data-screen.
      document.querySelectorAll('[data-screen]').forEach(b=>{
        if(b.dataset.nav)return;
        b.onclick=()=>screen(b.dataset.screen);
      });

      // Barra inferior: além de marcar o item ativo, também executa a tela correspondente.
      document.querySelectorAll('[data-nav]').forEach(b=>{
        b.onclick=()=>{
          const nav=b.dataset.nav||'inicio';
          const scr=b.dataset.screen||'';
          marcarNavAtiva(nav);
          if(nav==='inicio')return voltarInicio();
          if(scr)return screen(scr);
        };
      });
    }

    function chamarApiJsonp(url,params,timeoutMs){
      return new Promise((resolve,reject)=>{
        const cb='PSS_MBE_CB_'+Date.now()+'_'+Math.floor(Math.random()*100000);
        const script=document.createElement('script');
        const qs=new URLSearchParams(Object.assign({},params,{callback:cb}));
        const sep=url.includes('?')?'&':'?';
        let finalUrl=url+sep+qs.toString();
        let timer=setTimeout(()=>{cleanup();reject(new Error('Tempo esgotado ao consultar API.'))},Number(timeoutMs||12000));

        function cleanup(){
          clearTimeout(timer);
          try{delete window[cb]}catch(e){window[cb]=undefined}
          if(script&&script.parentNode)script.parentNode.removeChild(script);
        }

        window[cb]=dados=>{cleanup();resolve(dados)};
        script.onerror=()=>{cleanup();reject(new Error('Falha ao carregar API JSONP.'))};
        script.src=finalUrl;
        document.head.appendChild(script);
      });
    }

    async function loadApi(force,silencioso){
      const url=apiUrl();
      const tinhaCache=!!estado.jogo||estado.jogos.length>0||estado.ranking.length>0||estado.boloes.length>0;
      estado.carregando=!tinhaCache;
      estado.erroApi='';
      render();

      if(!url){
        estado.carregando=false;
        estado.erroApi='API fixa não configurada no index.html.';
        render();
        if(!tinhaCache)toastMsg(estado.erroApi);
        return;
      }

      const paramsBase={
        acao:'obterHomeBolaoEsportivo',
        id_bolao:CONFIG.ID_BOLAO,
        codigo_convite:CONFIG.CODIGO_CONVITE,
        telegram_id:estado.usuario.idTelegram,
        nome:estado.usuario.nome,
        username:estado.usuario.username,
        v:CONFIG.VERSAO,
        force:force?'1':''
      };

      try{
        let j;
        try{
          j=await chamarApiJsonp(url,paramsBase,14000);
        }catch(e1){
          console.warn('Primeira tentativa da API falhou, tentando novamente.',e1);
          await new Promise(r=>setTimeout(r,650));
          j=await chamarApiJsonp(url,Object.assign({},paramsBase,{force:'1',retry:Date.now()}),26000);
        }
        if(!j||!j.ok)throw new Error((j&&j.erro)||'Resposta inválida da API.');
        const dados=j.dados||{};
        aplicarDadosApi(dados,'api');
        salvarCache(dados);
        estado.carregando=false;
        estado.erroApi='';
        render();
      }catch(e){
        console.warn('API indisponível.',e);
        estado.carregando=false;
        estado.erroApi='API demorou ou falhou: '+e.message;
        render();
        if(!silencioso)toastMsg(tinhaCache?'API demorou/falhou. Mantendo dados já carregados/cache local.':estado.erroApi);
      }
    }


    async function iniciarCarregamentoInstantaneo(){
      const jsonOk=await carregarJsonPublicoEstatico();
      const jaTemDados=!!estado.jogo||estado.jogos.length>0||estado.ranking.length>0||estado.boloes.length>0;
      if(!jsonOk&&!jaTemDados){
        await loadApi(false,false);
      }else if(CONFIG.API_REFRESH_SILENCIOSO){
        setTimeout(()=>loadApi(false,true),900);
      }
    }

    (function(){initTelegram();limparCachesAntigosSeNecessario();horaAtual();setInterval(horaAtual,30000);setInterval(atualizarTimersVisiveis,1000);carregarCache();events();render();setTimeout(()=>iniciarCarregamentoInstantaneo(),50)})();
  </script>
