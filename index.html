    function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}

    function render(){
      const j=estado.jogo;
      flagA.textContent=j.flagMandante;flagB.textContent=j.flagVisitante;teamA.textContent=j.mandante;teamB.textContent=j.visitante;dataJogo.textContent=j.data;horaJogo.textContent=j.hora;
      ranking.innerHTML=estado.ranking.map(r=>`<div class="rank-row"><div class="pos ${r.classe}">${r.pos}</div><div class="avatar"><div class="face">${r.face}</div></div><div class="rank-name">${esc(r.nome)}</div><div class="pts">${esc(r.pontos)} <small>PTS</small></div><div class="medal">${r.medalha}</div></div>`).join('');
    }

    function horaAtual(){
      const d=new Date();hora.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')
    }

    function openModal(title,body,actions){
      modalTitle.innerHTML=title;modalBody.innerHTML=body;modalActions.innerHTML=actions||'<button class="btn primary" id="ok">Fechar</button>';modal.classList.add('show');
      const ok=document.getElementById('ok');if(ok)ok.onclick=closeModal;
      haptic('light');
    }
    function closeModal(){modal.classList.remove('show')}
    function toastMsg(m){toast.textContent=m;toast.classList.add('show');clearTimeout(toastMsg.t);toastMsg.t=setTimeout(()=>toast.classList.remove('show'),2600)}
    function haptic(t){if(tg&&tg.HapticFeedback){try{tg.HapticFeedback.impactOccurred(t)}catch(e){}}}
    function success(){if(tg&&tg.HapticFeedback){try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}}}

    function abrirPalpite(){
      estado.palpite='';
      const j=estado.jogo;
      openModal('⚽ Fazer Palpite',`
        <div class="mini"><strong>${j.flagMandante} ${j.mandante} VS ${j.flagVisitante} ${j.visitante}</strong><p>${j.data} às ${j.hora} • Palpites abertos</p></div>
        <div class="opts">
          <button class="opt" data-bet="MANDANTE"><span>Vitória ${j.mandante}</span><b>1</b></button>
          <button class="opt" data-bet="EMPATE"><span>Empate</span><b>X</b></button>
          <button class="opt" data-bet="VISITANTE"><span>Vitória ${j.visitante}</span><b>2</b></button>
        </div>
        <div class="score">
          <div class="field"><label>${j.mandante}</label><input id="golsA" type="number" min="0" inputmode="numeric" placeholder="0"></div>
          <b style="padding-bottom:12px;color:#0a5a35">X</b>
          <div class="field"><label>${j.visitante}</label><input id="golsB" type="number" min="0" inputmode="numeric" placeholder="0"></div>
        </div>`,
        '<button class="btn light" id="cancelar">Cancelar</button><button class="btn primary" id="confirmar">Confirmar Palpite</button>'
      );
      document.querySelectorAll('[data-bet]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-bet]').forEach(x=>x.classList.remove('active'));b.classList.add('active');estado.palpite=b.dataset.bet;haptic('light')});
      cancelar.onclick=closeModal;confirmar.onclick=confirmarPalpite;
    }

    async function confirmarPalpite(){
      const a=golsA.value.trim(),b=golsB.value.trim();
      if(!estado.palpite)return toastMsg('Selecione 1, X ou 2 para confirmar o palpite.');
      if(a===''||b==='')return toastMsg('Informe o placar palpitado antes de confirmar.');
      const payload={tipo:'PALPITE_BOLAO_ESPORTIVO',versao:CONFIG.VERSAO,dataHora:new Date().toISOString(),usuario:estado.usuario,jogo:estado.jogo,palpite:{resultado:estado.palpite,placarMandante:Number(a),placarVisitante:Number(b)}};
      try{
        await enviar(payload);
        localStorage.setItem('ultimo_palpite_bolao_esportivo',JSON.stringify(payload));
        closeModal();toastMsg('✅ Palpite registrado com sucesso.');success();
      }catch(e){console.error(e);toastMsg('Não foi possível registrar agora. Tente novamente.')}
    }

    async function enviar(payload){
      if(CONFIG.API_URL){
        const r=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
        const t=await r.text();if(!r.ok)throw new Error(t);return t;
      }
      if(tg&&CONFIG.ENVIAR_AO_BOT_SEM_API&&typeof tg.sendData==='function'){tg.sendData(JSON.stringify(payload));return 'ENVIADO_AO_BOT'}
      console.log(payload);return 'LOCAL';
    }

    function screen(name){
      if(name==='boloes')return openModal('🏆 Bolões',estado.boloes.map(b=>`<div class="mini"><strong>${esc(b.nome)} <span class="chip">${esc(b.status)}</span></strong><p>${b.participantes} participantes • ${b.jogos} jogos cadastrados</p></div>`).join(''));
      if(name==='jogos')return openModal('📅 Jogos',estado.jogos.map(j=>`<div class="mini"><strong>${esc(j.a)} x ${esc(j.b)}</strong><p>${j.data} às ${j.hora} • <span class="chip">${j.status}</span></p></div>`).join(''));
      if(name==='ranking')return openModal('🏆 Ranking Geral',estado.ranking.map(r=>`<div class="mini"><strong>${r.pos}º — ${esc(r.nome)}</strong><p>${esc(r.pontos)} pontos ${r.medalha}</p></div>`).join(''));
      if(name==='regulamento')return openModal('📄 Regulamento',`<div class="mini"><strong>Regras principais</strong><p>1. Cada participante registra o palpite antes do fechamento do jogo.</p><p>2. Palpites encerrados não poderão ser alterados.</p><p>3. A pontuação será calculada conforme o regulamento interno.</p><p>4. O ranking será atualizado após a conferência dos resultados.</p></div>`);
      if(name==='palpites'){let u=null;try{u=JSON.parse(localStorage.getItem('ultimo_palpite_bolao_esportivo')||'null')}catch(e){};return openModal('🎯 Palpites',u?`<div class="mini"><strong>Último palpite registrado</strong><p>${u.jogo.mandante} ${u.palpite.placarMandante} x ${u.palpite.placarVisitante} ${u.jogo.visitante}</p></div>`:`<div class="mini"><strong>Nenhum palpite registrado neste aparelho.</strong><p>Use o botão FAZER PALPITE no jogo em destaque.</p></div>`,'<button class="btn light" id="ok">Fechar</button><button class="btn primary" id="novo">Fazer Palpite</button>'),setTimeout(()=>{novo.onclick=abrirPalpite;ok.onclick=closeModal},0)}
      if(name==='mais')return openModal('☰ Mais',`<div class="mini"><strong>Central do Bolão</strong><p>Acesse regulamento, ranking, jogos, bolões ativos e dados do participante.</p></div><div class="mini"><strong>Participante</strong><p>${esc(estado.usuario.nome||'Participante')}</p></div>`);
    }

    function events(){
      btnPalpite.onclick=abrirPalpite;close.onclick=closeModal;modal.onclick=e=>{if(e.target.id==='modal')closeModal()};
      document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>screen(b.dataset.screen));
      document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-nav]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
    }

    async function loadApi(){
      if(!CONFIG.API_URL)return;
      try{
        const r=await fetch(CONFIG.API_URL+'?acao=obterHomeBolaoEsportivo&v='+encodeURIComponent(CONFIG.VERSAO));
        const j=await r.json();
        if(j&&j.ok&&j.dados){if(j.dados.jogoDestaque)estado.jogo=j.dados.jogoDestaque;if(Array.isArray(j.dados.ranking))estado.ranking=j.dados.ranking;if(Array.isArray(j.dados.boloes))estado.boloes=j.dados.boloes;if(Array.isArray(j.dados.jogos))estado.jogos=j.dados.jogos}
      }catch(e){console.warn('API indisponível. Usando dados locais.',e)}
    }

    (async()=>{initTelegram();horaAtual();setInterval(horaAtual,30000);await loadApi();render();events()})();
  </script>
</body>
</html>
