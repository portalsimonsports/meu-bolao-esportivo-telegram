            <div class="hour"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 7.5v4.8l3 1.8"></path></svg><span id="horaJogo">00:00</span></div>
          </div>
          <div><div class="flag flag-south-africa" id="flagB" aria-label="Bandeira da África do Sul"></div><div class="team" id="teamB">ÁFRICA DO SUL</div></div>
        </div>
        <div class="open"><i></i><span>PALPITES ABERTOS</span></div>
        <button class="bet" id="btnPalpite"><span>⚽</span><span>FAZER PALPITE</span></button>
      </section>

      <section class="card ranking">
        <div class="rank-head"><div class="rank-title"><i>🏆</i><span>RANKING GERAL</span></div><button class="see" data-screen="ranking">VER TODOS ›</button></div>
        <div class="rank-list" id="ranking"></div>
      </section>
    </section>

    <nav class="bottom">
      <button class="nav active" data-nav="inicio"><div class="ico">🏠</div><span>Início</span></button>
      <button class="nav" data-nav="jogos" data-screen="jogos"><div class="ico">📅</div><span>Jogos</span></button>
      <button class="nav" data-nav="palpites" data-screen="palpites"><div class="ico">🎯</div><span>Palpites</span></button>
      <button class="nav" data-nav="ranking" data-screen="ranking"><div class="ico">🏆</div><span>Ranking</span></button>
      <button class="nav" data-nav="mais" data-screen="mais"><div class="ico">☰</div><span>Mais</span></button>
    </nav>
    <div class="indicator"></div>
  </main>

  <div class="modal-bg" id="modal">
    <div class="modal">
      <div class="modal-head"><h2 id="modalTitle"></h2><button class="close" id="close">×</button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="actions" id="modalActions"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const URL_PARAMS=new URLSearchParams(window.location.search||'');
    const API_PARAM=URL_PARAMS.get('api')||'';
    if(API_PARAM){try{localStorage.setItem('PSS_MBE_API_URL',API_PARAM)}catch(e){}}

    const CONFIG={
      VERSAO:'V006_NAV_INFERIOR_FUNCIONAL',
      API_URL:API_PARAM||'', // Recebida automaticamente pelo botão do Telegram: ?api=WEBAPP_URL.
      API_URL_FIXA:'', // Opcional: cole aqui a URL /exec se quiser fixar manualmente.
      ID_BOLAO:URL_PARAMS.get('id_bolao')||'BOLAO001',
      ENVIAR_AO_BOT_SEM_API:true
    };

    const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
    const estado={
      usuario:{idTelegram:'',nome:'Participante',username:''},
      jogo:null,
      ranking:[],
      jogos:[],
      boloes:[],
      carregando:true,
      erroApi:'',
      palpite:''
    };

    function initTelegram(){
      if(!tg)return;
      tg.ready();tg.expand();
      try{tg.setHeaderColor('#062d1d');tg.setBackgroundColor('#00170e');tg.enableClosingConfirmation()}catch(e){}
      const u=tg.initDataUnsafe&&tg.initDataUnsafe.user?tg.initDataUnsafe.user:null;
      if(u){estado.usuario={idTelegram:u.id||'',nome:[u.first_name,u.last_name].filter(Boolean).join(' ')||u.username||'Participante',username:u.username||''}}
    }

    function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
    function apiUrl(){return String(CONFIG.API_URL||CONFIG.API_URL_FIXA||localStorage.getItem('PSS_MBE_API_URL')||'').trim()}
    function isAberto(j){return !!(j&&j.aceitaPalpite)}
    function statusJogo(j){return String(j&&j.status?j.status:(isAberto(j)?'Aberto':'Em breve'))}
    function idJogo(j){return String((j&&(j.id_jogo||j.id))||'')}


    function normalizarChave(v){
      return String(v||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
    }

    function chaveJogoSemHora(j){
      if(!j)return '';
      return [
        normalizarChave(j.id_bolao||CONFIG.ID_BOLAO),
        normalizarChave(j.mandante),
        normalizarChave(j.visitante),
        String(j.data||'').trim()
      ].join('|');
    }

    function scoreDuplicado(j){
      let score=0;
      const hora=String(j&&j.hora||'').trim();
      const limite=String(j&&j.limitePalpite||'').trim();
      if(hora)score+=10;
      if(hora&&hora!=='00:00'&&hora!=='00:00:00')score+=100;
      if(limite&&limite.indexOf('00:00')<0)score+=50;
      if(j&&j.aceitaPalpite)score+=5;
      return score;
    }

    function deduplicarJogos(jogos){
      const mapa={};
      (jogos||[]).forEach(j=>{
        const chave=chaveJogoSemHora(j);
        if(!chave)return;
        if(!mapa[chave]||scoreDuplicado(j)>scoreDuplicado(mapa[chave]))mapa[chave]=j;
      });
      return Object.values(mapa).sort((a,b)=>String((a.data||'')+' '+(a.hora||'')).localeCompare(String((b.data||'')+' '+(b.hora||''))));
    }


    function normalizarTextoPais(v){
      return String(v||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
    }

    function codigoPais(nome){
      const mapa={
        'MEXICO':'mx','SOUTH AFRICA':'za','AFRICA DO SUL':'za','KOREA REPUBLIC':'kr','COREIA DO SUL':'kr','CZECH REPUBLIC':'cz','REPUBLICA TCHECA':'cz','CANADA':'ca','BOSNIA AND HERZEGOVINA':'ba','BOSNIA E HERZEGOVINA':'ba','UNITED STATES':'us','USA':'us','ESTADOS UNIDOS':'us','PARAGUAY':'py','PARAGUAI':'py','QATAR':'qa','SWITZERLAND':'ch','SUICA':'ch','BRAZIL':'br','BRASIL':'br','MOROCCO':'ma','MARROCOS':'ma','HAITI':'ht','SCOTLAND':'gb-sct','ESCOCIA':'gb-sct','TURKIYE':'tr','TÜRKIYE':'tr','TURKEY':'tr','TURQUIA':'tr','GERMANY':'de','ALEMANHA':'de','CURACAO':'cw','CURAÇÃO':'cw','NETHERLANDS':'nl','HOLANDA':'nl','PAISES BAIXOS':'nl','JAPAN':'jp','JAPAO':'jp','COTE DIVOIRE':'ci',"COTE D'IVOIRE":'ci',"CÔTE D'IVOIRE":'ci','COSTA DO MARFIM':'ci','ECUADOR':'ec','SWEDEN':'se','SUECIA':'se','TUNISIA':'tn','TUNISIA':'tn','SPAIN':'es','ESPANHA':'es','CAPE VERDE ISLANDS':'cv','CABO VERDE':'cv','BELGIUM':'be','BELGICA':'be','EGYPT':'eg','EGITO':'eg','SAUDI ARABIA':'sa','ARABIA SAUDITA':'sa','URUGUAY':'uy','URUGUAI':'uy','IRAN':'ir','NEW ZEALAND':'nz','NOVA ZELANDIA':'nz','FRANCE':'fr','FRANCA':'fr','SENEGAL':'sn','IRAQ':'iq','NORWAY':'no','NORUEGA':'no','ARGENTINA':'ar','ALGERIA':'dz','ARGELIA':'dz','AUSTRIA':'at','JORDAN':'jo','JORDANIA':'jo','PORTUGAL':'pt','CONGO DR':'cd','DR CONGO':'cd','REPUBLICA DEMOCRATICA DO CONGO':'cd','ENGLAND':'gb-eng','INGLATERRA':'gb-eng','CROATIA':'hr','CROACIA':'hr','GHANA':'gh','PANAMA':'pa','UZBEKISTAN':'uz','COLOMBIA':'co'
      };
      return mapa[normalizarTextoPais(nome)]||'';
    }

    function flagUrl(codigo){
      codigo=String(codigo||'').trim().toLowerCase();
      return codigo?`https://flagcdn.com/${codigo}.svg`:'';
    }

    function renderFlag(el,codigo,emoji,nome){
      const code=String(codigo||codigoPais(nome)||'').trim().toLowerCase();
      el.className='flag';
      el.innerHTML='';
      if(code){
        const img=document.createElement('img');
        img.className='flag-img';
        img.alt='Bandeira de '+(nome||'time');
        img.src=flagUrl(code);
        img.onerror=function(){el.innerHTML='';el.textContent=emoji||'⚽'};
        el.appendChild(img);
      }else{
        el.textContent=emoji||'⚽';
      }
      el.setAttribute('aria-label','Bandeira/ícone de '+(nome||'time'));
    }

    function flagHtml(j,lado){
      const nome=lado==='mandante'?j.mandante:j.visitante;
      const code=lado==='mandante'?(j.codigoMandante||codigoPais(nome)):(j.codigoVisitante||codigoPais(nome));
      const emoji=lado==='mandante'?(j.flagMandante||'⚽'):(j.flagVisitante||'⚽');
      return code?`<img class="inline-flag" src="${flagUrl(code)}" alt="${esc(nome)}">`:esc(emoji);
    }

    function normalizarJogo(j){
      if(!j)return null;
      return {
        id:j.id||j.id_jogo||'',
        id_bolao:j.id_bolao||CONFIG.ID_BOLAO,
        id_jogo:j.id_jogo||j.id||'',
        mandante:j.mandante||j.a||'MANDANTE',
        visitante:j.visitante||j.b||'VISITANTE',
        flagMandante:j.flagMandante||j.flag_mandante||j.flagMandanteEmoji||'⚽',
        flagVisitante:j.flagVisitante||j.flag_visitante||j.flagVisitanteEmoji||'⚽',
        codigoMandante:j.codigoMandante||j.codigo_mandante||codigoPais(j.mandante||j.a),
        codigoVisitante:j.codigoVisitante||j.codigo_visitante||codigoPais(j.visitante||j.b),
        data:j.data||'',
        hora:j.hora||'',
        dataHora:j.dataHora||'',
        limitePalpite:j.limitePalpite||'',
        status:j.status||'Em breve',
        aceitaPalpite:j.aceitaPalpite===true||String(j.aceitaPalpite).toUpperCase()==='SIM'
      };
    }

    function render(){
      const j=estado.jogo;
      const openText=document.querySelector('.open span');

      if(!j){
        flagA.className='flag';flagB.className='flag';
        flagA.textContent='⚽';flagB.textContent='📡';
        teamA.textContent='DADOS';teamB.textContent='REAIS';
        dataJogo.textContent='--/--/----';horaJogo.textContent='--:--';
        if(openText)openText.textContent=estado.carregando?'CARREGANDO API REAL':(estado.erroApi?'API NÃO CONFIGURADA':'SEM JOGOS DISPONÍVEIS');
        btnPalpite.disabled=true;
        btnPalpite.innerHTML='<span>📡</span><span>AGUARDANDO JOGO REAL</span>';
      }else{
        renderFlag(flagA,j.codigoMandante,j.flagMandante,j.mandante);
        renderFlag(flagB,j.codigoVisitante,j.flagVisitante,j.visitante);
        teamA.textContent=j.mandante;
        teamB.textContent=j.visitante;
        dataJogo.textContent=j.data||'--/--/----';
        horaJogo.textContent=j.hora||'--:--';
        if(openText)openText.textContent=statusJogo(j).toUpperCase();
        btnPalpite.disabled=!isAberto(j);
        btnPalpite.innerHTML=isAberto(j)?'<span>⚽</span><span>FAZER PALPITE</span>':'<span>🔒</span><span>PALPITE INDISPONÍVEL</span>';
      }

      ranking.innerHTML=estado.ranking.length?estado.ranking.map(r=>{
        const face=r.face||r.avatar||'👤';
        return `<div class="rank-row"><div class="pos ${esc(r.classe||'bronze')}">${esc(r.pos||'')}</div><div class="avatar"><div class="face">${face}</div></div><div class="rank-name">${esc(r.nome||'Participante')}</div><div class="pts">${esc(r.pontos||0)} <small>PTS</small></div><div class="medal">${esc(r.medalha||'🏅')}</div></div>`;
      }).join(''):`<div class="rank-row" style="grid-template-columns:1fr;height:auto;min-height:58px"><div class="rank-name">${estado.carregando?'Carregando ranking real...':'Ainda não há ranking registrado.'}</div></div>`;
    }

    function horaAtual(){
      const d=new Date();hora.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')
    }

    function openModal(title,body,actions){
      modalTitle.innerHTML=title;modalBody.innerHTML=body;modalActions.innerHTML=actions||'<button class="btn primary" id="ok">Fechar</button>';modal.classList.add('show');
      const ok=document.getElementById('ok');if(ok)ok.onclick=closeModal;
      haptic('light');
    }
    function closeModal(){modal.classList.remove('show')}
    function toastMsg(m){toast.textContent=m;toast.classList.add('show');clearTimeout(toastMsg.t);toastMsg.t=setTimeout(()=>toast.classList.remove('show'),3000)}
    function haptic(t){if(tg&&tg.HapticFeedback){try{tg.HapticFeedback.impactOccurred(t)}catch(e){}}}
    function success(){if(tg&&tg.HapticFeedback){try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}}}

    function abrirPalpite(){
      const j=estado.jogo;
      if(!j)return toastMsg('Nenhum jogo real foi carregado pela API ainda.');
      if(!isAberto(j))return toastMsg('Este jogo não está aberto para palpite neste momento.');

      estado.palpite='';
      openModal('⚽ Fazer Palpite',`
        <div class="mini"><strong>${flagHtml(j,'mandante')} ${esc(j.mandante)} VS ${flagHtml(j,'visitante')} ${esc(j.visitante)}</strong><p>${esc(j.data)} às ${esc(j.hora)} • ${esc(statusJogo(j))}</p>${j.limitePalpite?`<p>Limite: ${esc(j.limitePalpite)}</p>`:''}</div>
        <div class="opts">
          <button class="opt" data-bet="MANDANTE"><span>Vitória ${esc(j.mandante)}</span><b>1</b></button>
          <button class="opt" data-bet="EMPATE"><span>Empate</span><b>X</b></button>
          <button class="opt" data-bet="VISITANTE"><span>Vitória ${esc(j.visitante)}</span><b>2</b></button>
        </div>
        <div class="score">
          <div class="field"><label>${esc(j.mandante)}</label><input id="golsA" type="number" min="0" max="30" inputmode="numeric" placeholder="0"></div>
          <b style="padding-bottom:12px;color:#0a5a35">X</b>
          <div class="field"><label>${esc(j.visitante)}</label><input id="golsB" type="number" min="0" max="30" inputmode="numeric" placeholder="0"></div>
        </div>`,
        '<button class="btn light" id="cancelar">Cancelar</button><button class="btn primary" id="confirmar">Confirmar Palpite</button>'
      );
      document.querySelectorAll('[data-bet]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-bet]').forEach(x=>x.classList.remove('active'));b.classList.add('active');estado.palpite=b.dataset.bet;haptic('light')});
      cancelar.onclick=closeModal;confirmar.onclick=confirmarPalpite;
    }

    async function confirmarPalpite(){
      const j=estado.jogo;
      const a=golsA.value.trim(),b=golsB.value.trim();
      if(!j||!isAberto(j))return toastMsg('Este jogo não está aberto para palpite.');
      if(!estado.palpite)return toastMsg('Selecione 1, X ou 2 para confirmar o palpite.');
      if(a===''||b==='')return toastMsg('Informe o placar palpitado antes de confirmar.');

      const gm=Number(a),gv=Number(b);
      if(Number.isNaN(gm)||Number.isNaN(gv)||gm<0||gv<0||gm>30||gv>30)return toastMsg('Informe um placar válido entre 0 e 30.');

      const payload={
        tipo:'PALPITE_BOLAO_ESPORTIVO',
        versao:CONFIG.VERSAO,
        dataHora:new Date().toISOString(),
        id_bolao:j.id_bolao||CONFIG.ID_BOLAO,
        id_jogo:j.id_jogo||j.id,
        usuario:estado.usuario,
        jogo:j,
        palpite:{resultado:estado.palpite,placarMandante:gm,placarVisitante:gv}
      };

      try{
        const destino=await enviar(payload);
        localStorage.setItem('ultimo_palpite_bolao_esportivo',JSON.stringify(payload));
        closeModal();
        toastMsg(destino==='LOCAL'?'Palpite salvo apenas neste aparelho. Abra pelo Telegram para enviar ao bot.':'✅ Palpite enviado ao bot para registro.');
        success();
      }catch(e){console.error(e);toastMsg('Não foi possível registrar agora. Abra pelo Telegram e tente novamente.')}
    }

    async function enviar(payload){
      if(tg&&CONFIG.ENVIAR_AO_BOT_SEM_API&&typeof tg.sendData==='function'){
        tg.sendData(JSON.stringify(payload));
        return 'BOT';
      }
      console.log('PALPITE_LOCAL_NAO_ENVIADO_AO_BOT',payload);
      return 'LOCAL';
    }

    function telaVazia(msg){
      return `<div class="empty">${esc(msg)}</div>`;
    }

    function selecionarJogoPorId(id){
      const j=estado.jogos.find(x=>idJogo(x)===String(id));
      if(!j)return toastMsg('Jogo não encontrado na lista carregada.');
      estado.jogo=j;
      render();
      closeModal();
      toastMsg(isAberto(j)?'Jogo selecionado. Toque em Fazer Palpite.':'Jogo selecionado, mas ainda não está aberto para palpite.');
    }

    function screen(name){
      if(name==='boloes'){
        const body=estado.boloes.length?estado.boloes.map(b=>`<div class="mini"><strong>${esc(b.nome)} <span class="chip">${esc(b.status||'Ativo')}</span></strong><p>${esc(b.participantes??0)} participantes • ${esc(b.jogos??0)} jogos cadastrados</p></div>`).join(''):telaVazia(estado.erroApi||'Nenhum bolão real retornado pela API.');
        return openModal('🏆 Bolões',body);
      }

      if(name==='jogos'){
        const body=estado.jogos.length?estado.jogos.map(j=>`<button class="mini clickable" data-select-jogo="${esc(idJogo(j))}"><strong>${flagHtml(j,'mandante')} ${esc(j.mandante)} x ${flagHtml(j,'visitante')} ${esc(j.visitante)}</strong><p>${esc(j.data)} às ${esc(j.hora)} • <span class="chip">${esc(statusJogo(j))}</span></p>${j.limitePalpite?`<p>Limite: ${esc(j.limitePalpite)}</p>`:''}</button>`).join(''):telaVazia(estado.erroApi||'Nenhum jogo real foi retornado pela API.');
        openModal('📅 Jogos',body);
        document.querySelectorAll('[data-select-jogo]').forEach(b=>b.onclick=()=>selecionarJogoPorId(b.dataset.selectJogo));
        return;
      }

      if(name==='ranking'){
        const body=estado.ranking.length?estado.ranking.map(r=>`<div class="mini"><strong>${esc(r.pos)}º — ${esc(r.nome)}</strong><p>${esc(r.pontos)} pontos ${esc(r.medalha||'🏅')}</p></div>`).join(''):telaVazia('Ainda não há ranking real registrado.');
        return openModal('🏆 Ranking Geral',body);
      }

      if(name==='regulamento')return openModal('📄 Regulamento',`<div class="mini"><strong>Regras principais</strong><p>1. Cada participante registra o palpite antes do fechamento do jogo.</p><p>2. Palpites encerrados não poderão ser alterados.</p><p>3. A pontuação será calculada conforme o regulamento interno.</p><p>4. O ranking será atualizado após a conferência dos resultados.</p></div>`);

      if(name==='palpites'){
        let u=null;try{u=JSON.parse(localStorage.getItem('ultimo_palpite_bolao_esportivo')||'null')}catch(e){}
        openModal('🎯 Palpites',u?`<div class="mini"><strong>Último palpite neste aparelho</strong><p>${esc(u.jogo.mandante)} ${esc(u.palpite.placarMandante)} x ${esc(u.palpite.placarVisitante)} ${esc(u.jogo.visitante)}</p></div>`:`<div class="mini"><strong>Nenhum palpite salvo neste aparelho.</strong><p>Use o botão FAZER PALPITE no jogo em destaque.</p></div>`,'<button class="btn light" id="ok">Fechar</button><button class="btn primary" id="novo">Fazer Palpite</button>');
        setTimeout(()=>{novo.onclick=abrirPalpite;ok.onclick=closeModal},0);
        return;
      }

      if(name==='mais')return openModal('☰ Mais',`<div class="mini"><strong>Central do Bolão</strong><p>Acesse regulamento, ranking, jogos, bolões ativos e dados do participante.</p></div><div class="mini"><strong>Participante</strong><p>${esc(estado.usuario.nome||'Participante')}</p></div><div class="mini"><strong>API</strong><p>${apiUrl()?esc(apiUrl()):'API não informada no link do Mini App.'}</p></div>`);
    }

    function marcarNavAtiva(nav){
      document.querySelectorAll('[data-nav]').forEach(x=>x.classList.remove('active'));
      const alvo=document.querySelector(`[data-nav="${nav}"]`);
      if(alvo)alvo.classList.add('active');
    }

    function voltarInicio(){
      marcarNavAtiva('inicio');
      closeModal();
      try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){window.scrollTo(0,0)}
    }

    function events(){
      btnPalpite.onclick=abrirPalpite;
      close.onclick=closeModal;
      modal.onclick=e=>{if(e.target.id==='modal')closeModal()};

      // Botões superiores e links internos com data-screen.
      document.querySelectorAll('[data-screen]').forEach(b=>{
        if(b.dataset.nav)return;
        b.onclick=()=>screen(b.dataset.screen);
      });

      // Barra inferior: além de marcar o item ativo, também executa a tela correspondente.
      document.querySelectorAll('[data-nav]').forEach(b=>{
        b.onclick=()=>{
          const nav=b.dataset.nav||'inicio';
          const scr=b.dataset.screen||'';
          marcarNavAtiva(nav);
          if(nav==='inicio')return voltarInicio();
          if(scr)return screen(scr);
        };
      });
    }

    function chamarApiJsonp(url,params){
      return new Promise((resolve,reject)=>{
        const cb='PSS_MBE_CB_'+Date.now()+'_'+Math.floor(Math.random()*100000);
        const script=document.createElement('script');
        const qs=new URLSearchParams(Object.assign({},params,{callback:cb}));
        const sep=url.includes('?')?'&':'?';
        let finalUrl=url+sep+qs.toString();
        let timer=setTimeout(()=>{cleanup();reject(new Error('Tempo esgotado ao consultar API.'))},15000);

        function cleanup(){
          clearTimeout(timer);
          try{delete window[cb]}catch(e){window[cb]=undefined}
          if(script&&script.parentNode)script.parentNode.removeChild(script);
        }

        window[cb]=dados=>{cleanup();resolve(dados)};
        script.onerror=()=>{cleanup();reject(new Error('Falha ao carregar API JSONP.'))};
        script.src=finalUrl;
        document.head.appendChild(script);
      });
    }

    async function loadApi(){
      const url=apiUrl();
      estado.carregando=true;
      estado.erroApi='';
      render();

      if(!url){
        estado.carregando=false;
        estado.erroApi='API real não informada. Reconfigure o botão Mini App no Apps Script para abrir com ?api=WEBAPP_URL.';
        render();
        return;
      }

      try{
        const j=await chamarApiJsonp(url,{acao:'obterHomeBolaoEsportivo',id_bolao:CONFIG.ID_BOLAO,v:CONFIG.VERSAO,t:Date.now()});
        if(!j||!j.ok)throw new Error((j&&j.erro)||'Resposta inválida da API.');

        const dados=j.dados||{};
        if(dados.id_bolao)CONFIG.ID_BOLAO=dados.id_bolao;
        estado.jogos=deduplicarJogos(Array.isArray(dados.jogos)?dados.jogos.map(normalizarJogo).filter(Boolean):[]);
        estado.ranking=Array.isArray(dados.ranking)?dados.ranking:[];
        estado.boloes=Array.isArray(dados.boloes)?dados.boloes:[];
        {
          const destaque=normalizarJogo(dados.jogoDestaque);
          const chaveDestaque=chaveJogoSemHora(destaque);
          const destaqueFiltrado=chaveDestaque?estado.jogos.find(j=>chaveJogoSemHora(j)===chaveDestaque):null;
          estado.jogo=destaqueFiltrado||destaque||estado.jogos.find(isAberto)||estado.jogos[0]||null;
        }
        estado.carregando=false;
        estado.erroApi='';
        render();
      }catch(e){
        console.warn('API indisponível.',e);
        estado.carregando=false;
        estado.erroApi='Não foi possível carregar os dados reais da API: '+e.message;
        render();
        toastMsg(estado.erroApi);
      }
    }

    (async()=>{initTelegram();horaAtual();setInterval(horaAtual,30000);render();events();await loadApi()})();
  </script>
</body>
</html>
